openapi: 3.0.3
info:
  title: EAGLES API (Project Atlas)
  version: "1.0.0-draft"
  description: >
    Canonical API contract for EAGLES V1. Route Handlers implemented in
    Phase 4+ must match this document; no endpoint may be added to the
    application that isn't specified here first (CLAUDE.md rule 2).
    Authentication itself (`/api/auth/*`) is handled entirely by Auth.js
    and is not enumerated below — every path in this document requires an
    authenticated session (Auth.js JWT cookie) unless noted otherwise, and
    every mutating operation is authorized server-side per
    `docs/07_Security/01_Security_Architecture.md`.
servers:
  - url: /api

tags:
  - name: profile
  - name: admin
  - name: projects
  - name: issues
  - name: comments
  - name: attachments
  - name: labels
  - name: components
  - name: sprints
  - name: backlog
  - name: board
  - name: notifications
  - name: search
  - name: reports
  - name: dashboard

paths:
  /users/me:
    get:
      tags: [profile]
      summary: Get the current authenticated user's profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      tags: [profile]
      summary: Update own profile (name, avatar, notification preferences)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /admin/users:
    get:
      tags: [admin]
      summary: List all users in the organization (ADMIN only)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/User" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Invite a new user (ADMIN only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteUserInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserIdParam"
    patch:
      tags: [admin]
      summary: Update a user's org role or active status (ADMIN only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserAdminInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/organization:
    get:
      tags: [admin]
      summary: Get organization settings (ADMIN only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
    patch:
      tags: [admin]
      summary: Update organization settings (ADMIN only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }

  /admin/audit-log:
    get:
      tags: [admin]
      summary: List audit log entries, newest first (ADMIN only)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuditLogEntry" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /home:
    get:
      tags: [home]
      summary: Personal Home — My Work, attention inbox, continue working, due soon, projects (ADR-0012)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeResponse" }

  /projects/{projectId}/star:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    post:
      tags: [home]
      summary: Star a project for the Home strip
      responses:
        "200": { description: Starred }
        "404": { description: Project not found / not visible }
    delete:
      tags: [home]
      summary: Unstar a project
      responses:
        "200": { description: Unstarred }

  /projects:
    get:
      tags: [projects]
      summary: List projects visible to the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      tags: [projects]
      summary: Create a project (creator becomes LEAD)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [projects]
      summary: Get a project by id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      summary: Update project settings (LEAD only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [projects]
      summary: Soft-delete a project (LEAD only)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }

  /projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [projects]
      summary: List project members
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectMember" }
    post:
      tags: [projects]
      summary: Add a member to the project (LEAD only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProjectMemberInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMember" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /projects/{projectId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
      - name: memberId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [projects]
      summary: Change a member's project role (LEAD only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMember" }
        "409":
          description: Cannot remove the last LEAD from a project
    delete:
      tags: [projects]
      summary: Remove a member from the project (LEAD only)
      responses:
        "204": { description: Removed }
        "409":
          description: Cannot remove the last LEAD from a project

  /projects/{projectId}/issues:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [issues]
      summary: List issues in a project
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/IssueStatus" }
        - name: sprintId
          in: query
          schema: { type: string }
          description: Pass "null" to filter for backlog (unscheduled) issues
        - name: assigneeId
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/IssueType" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Issue" }
    post:
      tags: [issues]
      summary: Create an issue (server generates the key from Project.issueKeyCounter)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIssueInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }

  /issues/{issueId}:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    get:
      tags: [issues]
      summary: Get an issue by id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [issues]
      summary: Update an issue's fields (title, description, priority, assignee, sprint, labels, etc.)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIssueInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
    delete:
      tags: [issues]
      summary: Soft-delete an issue
      responses:
        "204": { description: Deleted }

  /issues/{issueId}/transition:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    post:
      tags: [issues]
      summary: Transition an issue's status (validated against the fixed V1 workflow)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/IssueStatus" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "422":
          description: Invalid transition for the current status

  /issues/{issueId}/rank:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    patch:
      tags: [board, backlog]
      summary: Reorder an issue within its board column or the backlog (string fractional rank, ADR-0009/0013; OCC, ADR-0011)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                scope:
                  type: string
                  enum: [board, backlog]
                  default: board
                  description: Which view's neighbours to validate against (ADR-0013)
                status:
                  type: string
                  description: Board-scope only — a column move; runs the workflow check
                beforeId: { type: string, nullable: true, description: neighbour with the smaller rank (null = list/column start) }
                afterId: { type: string, nullable: true, description: neighbour with the larger rank (null = list/column end) }
                expectedVersion:
                  type: integer
                  description: Optimistic-concurrency token (ADR-0011)
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }

  /issues/{issueId}/comments:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    get:
      tags: [comments]
      summary: List comments on an issue, oldest-first, keyset-paginated
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: take
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Comment" }
                  nextCursor: { type: string, nullable: true }
                  canComment: { type: boolean }
    post:
      tags: [comments]
      summary: Add a comment (MEMBER/LEAD). parentCommentId reserved for future threading (ADR-0016).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                parentCommentId:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }

  /comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [comments]
      summary: Edit own comment (OCC, ADR-0011)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body, expectedVersion]
              properties:
                body: { type: string }
                expectedVersion: { type: integer, description: OCC token }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
    delete:
      tags: [comments]
      summary: Delete own comment (or any comment, if PROJECT_LEAD/ADMIN)
      responses:
        "204": { description: Deleted }

  /issues/{issueId}/attachments:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    get:
      tags: [attachments]
      summary: List attachments on an issue, oldest-first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, canUpload]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Attachment" }
                  canUpload:
                    type: boolean
                    description: Whether the viewer may upload (MEMBER/LEAD on a non-archived project)
    post:
      tags: [attachments]
      summary: Upload an attachment (multipart; MIME type + size validated server-side, ADR-0017)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "403": { description: Caller is not a project member }
        "422":
          description: File is empty, exceeds the size limit, or its MIME type is not in the allow-list

  /attachments/{attachmentId}:
    parameters:
      - name: attachmentId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [attachments]
      summary: Delete an attachment (uploader, or a project LEAD). Soft-deletes the row; blob removal is best-effort (BR-6).
      responses:
        "200": { description: Deleted }
        "403": { description: Caller is neither the uploader nor a project LEAD }

  /attachments/{attachmentId}/download:
    parameters:
      - name: attachmentId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [attachments]
      summary: >-
        RBAC-gated proxy of the blob bytes (ADR-0017). The bytes are streamed
        through this route after a tenant + role check — never a public URL.
        A signed-URL redirect is a documented future scale seam.
      responses:
        "200":
          description: The file bytes, with Content-Type and Content-Disposition set
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Attachment not found, or its blob is no longer available }

  /labels:
    get:
      tags: [labels]
      summary: All org labels + the viewer's create/manage rights (17_labels.md)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, canCreate, canManage]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Label" }
                  canCreate: { type: boolean }
                  canManage: { type: boolean }
    post:
      tags: [labels]
      summary: Create a label (any org member, BR-1). Case-insensitive unique per org.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: { type: string, maxLength: 50 }
                color: { type: string, description: "#RRGGBB hex" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Label" } } } }
        "409": { description: A label with that name (case-insensitive) already exists }

  /labels/{labelId}:
    parameters:
      - { name: labelId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [labels]
      summary: Rename/recolor a label (org ADMIN or a project LEAD, BR-2)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 50 }
                color: { type: string }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Label" } } } }
        "403": { description: Caller may not manage labels }
    delete:
      tags: [labels]
      summary: Soft-delete a label; detaches it from issues (BR-2/BR-6)
      responses:
        "200": { description: Deleted }
        "403": { description: Caller may not manage labels }

  /issues/{issueId}/labels:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    get:
      tags: [labels]
      summary: The labels on an issue
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Label" } } } } }
    put:
      tags: [labels]
      summary: Replace the issue's label set (MEMBER/LEAD, idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labelIds]
              properties:
                labelIds: { type: array, items: { type: string } }
      responses:
        "200": { description: The issue's labels after the change, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Label" } } } } }
        "403": { description: Caller is not a project member }

  /projects/{projectId}/components:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [components]
      summary: The project's components + the viewer's manage right (18_components.md)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, canManage]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Component" } }
                  canManage: { type: boolean }
    post:
      tags: [components]
      summary: Create a component (project LEAD, BR-1). Case-insensitive unique per project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 50 }
                description: { type: string, maxLength: 500, nullable: true }
                ownerId: { type: string, nullable: true, description: default assignee (owner); must be a project member }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Component" } } } }
        "403": { description: Caller is not a project LEAD }
        "409": { description: A component with that name already exists in the project }

  /components/{componentId}:
    parameters:
      - { name: componentId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [components]
      summary: Rename/edit/reassign lead (project LEAD, BR-1)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 50 }
                description: { type: string, maxLength: 500, nullable: true }
                ownerId: { type: string, nullable: true }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Component" } } } }
        "403": { description: Caller is not a project LEAD }
    delete:
      tags: [components]
      summary: Soft-delete a component; detaches it from issues (BR-1/BR-7)
      responses:
        "200": { description: Deleted }
        "403": { description: Caller is not a project LEAD }

  /issues/{issueId}/components:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    get:
      tags: [components]
      summary: The components on an issue
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Component" } } } } }
    put:
      tags: [components]
      summary: >-
        Replace the issue's component set (MEMBER/LEAD). A newly added component
        with a lead auto-assigns the issue if it's unassigned (BR-3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [componentIds]
              properties:
                componentIds: { type: array, items: { type: string } }
      responses:
        "200": { description: The issue's components after the change, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Component" } } } } }
        "403": { description: Caller is not a project member }

  /projects/{projectId}/sprints/order:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    patch:
      tags: [sprints]
      summary: Reorder the planned-sprint queue (FUT-8; LEAD)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sprintIds]
              properties:
                sprintIds:
                  type: array
                  items: { type: string }
                  description: All non-completed sprint ids in the desired order
      responses:
        "200": { description: Reordered }
        "403": { description: Caller is not a project LEAD }
        "422": { description: The sprint list is stale (missing/extra ids) }

  /projects/{projectId}/sprints:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [sprints]
      summary: List sprints for a project, each with derived progress
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SprintWithProgress" }
    post:
      tags: [sprints]
      summary: Create a sprint (PLANNED status; LEAD only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSprintInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sprint" }

  /sprints/{sprintId}:
    parameters:
      - $ref: "#/components/parameters/SprintIdParam"
    patch:
      tags: [sprints]
      summary: Update sprint details (name, goal, dates) — LEAD only
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSprintInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SprintWithProgress" }
    delete:
      tags: [sprints]
      summary: >
        Soft-delete a PLANNED or COMPLETED sprint (LEAD). An ACTIVE sprint must be
        completed first (409). A deleted sprint's issues return to the backlog.
      responses:
        "200": { description: Deleted }
        "403": { description: Caller is not a project LEAD }
        "409": { description: Sprint is ACTIVE }

  /sprints/{sprintId}/start:
    parameters:
      - $ref: "#/components/parameters/SprintIdParam"
    post:
      tags: [sprints]
      summary: Start a sprint (requires name + start/end dates; only one ACTIVE sprint per project)
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sprint" }
        "409":
          description: Another sprint is already ACTIVE for this project

  /sprints/{sprintId}/complete:
    parameters:
      - $ref: "#/components/parameters/SprintIdParam"
    post:
      tags: [sprints]
      summary: >
        Complete a sprint (ACTIVE → COMPLETED); incomplete issues (status != DONE)
        move to the backlog, or to a chosen follow-up PLANNED sprint, keeping their
        ranks (LEAD only).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                moveIncompleteToSprintId:
                  type: string
                  nullable: true
                  description: A PLANNED sprint in the same project; omit/null → backlog
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SprintWithProgress" }
        "409":
          description: Sprint is not ACTIVE

  /issues/{issueId}/sprint:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    patch:
      tags: [sprints, issues]
      summary: >
        Move an issue to a sprint or back to the backlog, positioned between two
        neighbours — one atomic sprintId + rank write, OCC-guarded (ADR-0014).
        MEMBER/LEAD only; target sprint must be same-project and not COMPLETED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveIssueToSprintInput" }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "403": { description: Caller lacks write access (VIEWER/non-member) }
        "409": { description: Stale version, out-of-order neighbours, or a COMPLETED sprint }

  /projects/{projectId}/backlog:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [backlog]
      summary: Get the ordered backlog (issues with sprintId = null), ordered by rank; keyset-paginated
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque keyset cursor (the last item's id from the previous page)
        - name: take
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
          description: Page size (capped at 100)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacklogResponse" }

  /projects/{projectId}/board:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
      - name: sprintId
        in: query
        schema: { type: string }
        description: Defaults to the project's current ACTIVE sprint if omitted
    get:
      tags: [board]
      summary: Get board issues grouped by status column
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardResponse" }

  /notifications:
    get:
      tags: [notifications]
      summary: List the current user's notifications, newest first
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }

  /notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [notifications]
      summary: Mark a single notification as read
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }

  /notifications/read-all:
    post:
      tags: [notifications]
      summary: Mark all of the current user's notifications as read
      responses:
        "204": { description: Done }

  /search:
    get:
      tags: [search]
      summary: Global search across projects and issues the user is authorized to see
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }

  /projects/{projectId}/reports/velocity:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [reports]
      summary: Velocity report (completed story points per closed sprint)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VelocityReport" }

  /projects/{projectId}/reports/status-breakdown:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [reports]
      summary: Current issue count by status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusBreakdownReport" }

  /projects/{projectId}/reports/cycle-time:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [reports]
      summary: Average time from IN_PROGRESS to DONE over a trailing window
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CycleTimeReport" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: >
        Auth.js JWT session cookie (HttpOnly, SameSite=Lax). Set on
        successful sign-in via /api/auth/*; every path in this document
        requires it unless the operation is otherwise unauthenticated
        (none currently are).

  parameters:
    ProjectIdParam:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    IssueIdParam:
      name: issueId
      in: path
      required: true
      schema: { type: string }
    SprintIdParam:
      name: sprintId
      in: path
      required: true
      schema: { type: string }
    UserIdParam:
      name: userId
      in: path
      required: true
      schema: { type: string }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Forbidden:
      description: Caller is authenticated but not authorized for this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found (or soft-deleted)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    OrgRole:
      type: string
      enum: [ADMIN, MEMBER]
    ProjectRole:
      type: string
      enum: [LEAD, MEMBER, VIEWER]
    IssueType:
      type: string
      enum: [EPIC, STORY, TASK, BUG]
    IssueStatus:
      type: string
      enum: [TODO, IN_PROGRESS, IN_REVIEW, DONE]
    IssuePriority:
      type: string
      enum: [LOWEST, LOW, MEDIUM, HIGH, HIGHEST]
    SprintStatus:
      type: string
      enum: [PLANNED, ACTIVE, COMPLETED]
    ProjectStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    NotificationType:
      type: string
      enum: [ASSIGNED, MENTIONED, STATUS_CHANGED, COMMENT_ADDED]

    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        domain: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        orgRole: { $ref: "#/components/schemas/OrgRole" }
        isActive: { type: boolean }
        notificationsEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }

    UpdateProfileInput:
      type: object
      properties:
        name: { type: string }
        notificationsEnabled: { type: boolean }
        avatarUrl: { type: string, nullable: true }

    InviteUserInput:
      type: object
      required: [email, name]
      properties:
        email: { type: string }
        name: { type: string }
        orgRole: { $ref: "#/components/schemas/OrgRole" }

    UpdateUserAdminInput:
      type: object
      properties:
        orgRole: { $ref: "#/components/schemas/OrgRole" }
        isActive: { type: boolean }

    UpdateOrganizationInput:
      type: object
      properties:
        name: { type: string }
        domain: { type: string }

    AuditLogEntry:
      type: object
      properties:
        id: { type: string }
        actorId: { type: string, nullable: true }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        beforeData: { type: object, nullable: true }
        afterData: { type: object, nullable: true }
        createdAt: { type: string, format: date-time }

    Project:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateProjectInput:
      type: object
      required: [key, name]
      properties:
        key: { type: string, description: "Short uppercase code, e.g. ENG" }
        name: { type: string }
        description: { type: string }

    UpdateProjectInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }

    ProjectMember:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        projectId: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }

    AddProjectMemberInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          description: >
            Email of an existing, active org user. Members are added by
            email rather than userId because project LEADs have no
            org-wide user-search endpoint (that's ADMIN-only) — email is
            the natural key a LEAD actually knows. See
            docs/02_Modules/03_projects.md §API.
        role: { $ref: "#/components/schemas/ProjectRole" }

    Sprint:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        goal: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/SprintStatus" }
        startDate: { type: string, format: date-time, nullable: true }
        endDate: { type: string, format: date-time, nullable: true }

    CreateSprintInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        goal: { type: string }

    UpdateSprintInput:
      type: object
      properties:
        name: { type: string }
        goal: { type: string }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }

    SprintProgress:
      type: object
      description: Derived at read time (GROUP BY status); never stored (ADR-0014).
      properties:
        totalIssues: { type: integer }
        doneIssues: { type: integer }
        totalStoryPoints: { type: integer }
        doneStoryPoints: { type: integer }

    SprintWithProgress:
      allOf:
        - $ref: "#/components/schemas/Sprint"
        - type: object
          properties:
            progress: { $ref: "#/components/schemas/SprintProgress" }
            canManage:
              type: boolean
              description: Whether the viewer may create/start/complete/edit (LEAD)

    MoveIssueToSprintInput:
      type: object
      required: [expectedVersion]
      properties:
        sprintId:
          type: string
          nullable: true
          description: Target sprint id, or null to return the issue to the backlog
        beforeId: { type: string, nullable: true }
        afterId: { type: string, nullable: true }
        expectedVersion:
          type: integer
          description: Optimistic-concurrency token (ADR-0011)

    Issue:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        key: { type: string }
        type: { $ref: "#/components/schemas/IssueType" }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/IssueStatus" }
        priority: { $ref: "#/components/schemas/IssuePriority" }
        assigneeId: { type: string, nullable: true }
        reporterId: { type: string }
        sprintId: { type: string, nullable: true }
        epicId: { type: string, nullable: true }
        storyPoints: { type: integer, nullable: true }
        rank: { type: string }
        dueDate: { type: string, format: date-time, nullable: true }
        labelIds: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateIssueInput:
      type: object
      required: [type, title]
      properties:
        type: { $ref: "#/components/schemas/IssueType" }
        title: { type: string }
        description: { type: string }
        priority: { $ref: "#/components/schemas/IssuePriority" }
        assigneeId: { type: string, nullable: true }
        sprintId: { type: string, nullable: true }
        epicId: { type: string, nullable: true }
        storyPoints: { type: integer }
        dueDate: { type: string, format: date-time }
        labelIds: { type: array, items: { type: string } }

    UpdateIssueInput:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        priority: { $ref: "#/components/schemas/IssuePriority" }
        assigneeId: { type: string, nullable: true }
        sprintId: { type: string, nullable: true }
        epicId: { type: string, nullable: true }
        storyPoints: { type: integer }
        dueDate: { type: string, format: date-time }
        labelIds: { type: array, items: { type: string } }

    Comment:
      type: object
      description: CommentDto (ADR-0016) — designed to grow (reactions/mentions/attachments/replyCount later).
      properties:
        id: { type: string }
        issueId: { type: string }
        parentCommentId: { type: string, nullable: true }
        body: { type: string }
        bodyFormat: { type: string, enum: [PLAIN, MARKDOWN] }
        author:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time, nullable: true }
        version: { type: integer, description: OCC token (ADR-0011) }
        canEdit: { type: boolean }
        canDelete: { type: boolean }

    Attachment:
      type: object
      description: >-
        AttachmentDto (ADR-0017) — designed to grow (scanStatus/previewUrl/hash/version
        are additive later). The blob itself is never exposed as a public URL.
      properties:
        id: { type: string }
        issueId: { type: string }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        uploadedBy:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        downloadUrl:
          type: string
          description: Path to the RBAC-gated download route (never a public URL)
        canDelete:
          type: boolean
          description: Whether the viewer may delete this attachment (uploader or LEAD)

    Label:
      type: object
      description: LabelDto (ADR-0018) — org-scoped tag.
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string, description: "#RRGGBB hex" }

    Component:
      type: object
      description: ComponentDto (ADR-0018) — project-scoped sub-system with an optional default owner.
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        owner:
          type: object
          nullable: true
          description: Default assignee; DB column is `leadId`, exposed as `owner`.
          properties:
            id: { type: string }
            name: { type: string }
            avatarUrl: { type: string, nullable: true }

    Notification:
      type: object
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/NotificationType" }
        entityType: { type: string }
        entityId: { type: string }
        message: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    BoardResponse:
      type: object
      properties:
        sprintId: { type: string, nullable: true }
        columns:
          type: array
          items:
            type: object
            properties:
              status: { $ref: "#/components/schemas/IssueStatus" }
              issues:
                type: array
                items: { $ref: "#/components/schemas/Issue" }

    BacklogResponse:
      type: object
      description: >
        One keyset-paginated page of the project's unscheduled issues
        (sprintId = null), ordered by the shared rank (ADR-0013).
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        nextCursor:
          type: string
          nullable: true
          description: Cursor for the next page; null on the last page
        canWrite:
          type: boolean
          description: Whether the viewer may drag to reorder (MEMBER/LEAD)

    HomeResponse:
      type: object
      description: >
        The composed Home payload (ADR-0012, docs/02_Modules/02_home.md). A FIXED
        set of sections; future modules feed these (esp. `attention`), never
        adding new ones.
      properties:
        myWork:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        attention:
          type: array
          items: { $ref: "#/components/schemas/AttentionItem" }
        continueWorking:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        dueSoon:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        starredProjects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        recentProjects:
          type: array
          items: { $ref: "#/components/schemas/Project" }

    AttentionItem:
      type: object
      description: One item in the unified attention inbox, from any AttentionSource.
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [ASSIGNED, UPDATED, MENTION, REVIEW_REQUEST, APPROVAL]
        title: { type: string }
        href: { type: string }
        actorId: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }

    SearchResponse:
      type: object
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/Issue" }

    VelocityReport:
      type: object
      properties:
        sprints:
          type: array
          items:
            type: object
            properties:
              sprintId: { type: string }
              sprintName: { type: string }
              committedPoints: { type: integer }
              completedPoints: { type: integer }

    StatusBreakdownReport:
      type: object
      properties:
        counts:
          type: object
          additionalProperties: { type: integer }

    CycleTimeReport:
      type: object
      properties:
        averageDays: { type: number }
        sampleSize: { type: integer }
        windowDays: { type: integer }

security:
  - sessionCookie: []
