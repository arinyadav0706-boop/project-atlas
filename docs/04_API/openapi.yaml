openapi: 3.0.3
info:
  title: EAGLES API (Project Atlas)
  version: "1.0.0-draft"
  description: >
    Canonical API contract for EAGLES V1. Route Handlers implemented in
    Phase 4+ must match this document; no endpoint may be added to the
    application that isn't specified here first (CLAUDE.md rule 2).
    Authentication itself (`/api/auth/*`) is handled entirely by Auth.js
    and is not enumerated below — every path in this document requires an
    authenticated session (Auth.js JWT cookie) unless noted otherwise, and
    every mutating operation is authorized server-side per
    `docs/07_Security/01_Security_Architecture.md`.
servers:
  - url: /api

tags:
  - name: profile
  - name: admin
  - name: projects
  - name: issues
  - name: comments
  - name: attachments
  - name: labels
  - name: components
  - name: sprints
  - name: backlog
  - name: board
  - name: notifications
  - name: search
  - name: reports
  - name: dashboard
  - name: dashboards

paths:
  /users/me:
    get:
      tags: [profile]
      summary: Get the current authenticated user's own profile (16_profile.md)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [profile]
      summary: Update own display name and/or in-app notification toggle
      description: >
        Self-service only. The request body accepts ONLY `name` and
        `notificationsEnabled` (16_profile.md BR-3) — privileged fields such as
        orgRole/isActive are not part of this schema and are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/me/avatar:
    post:
      tags: [profile]
      summary: Upload/replace own avatar (image, ≤ 2 MB) via the storage adapter
      description: Multipart image upload (16_profile.md BR-4, ADR-0027).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Avatar updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [profile]
      summary: Remove own avatar
      responses:
        "200":
          description: Avatar removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/{userId}/avatar:
    get:
      tags: [profile]
      summary: Serve a user's avatar image bytes (org-scoped proxy)
      description: >
        Returns the stored avatar bytes for a user in the caller's own
        organization (16_profile.md BR-4/F-1). This is the URL rendered in
        <img> across the app. 404 if the user is outside the caller's org or
        has no avatar.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Image bytes
          content:
            image/*:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users:
    get:
      tags: [admin]
      summary: List users in the organization, filterable (MANAGE_USERS)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Search by name or email
        - name: role
          in: query
          required: false
          schema: { $ref: "#/components/schemas/OrgRole" }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, inactive] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/User" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Invite a new user (ADMIN only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteUserInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserIdParam"
    patch:
      tags: [admin]
      summary: Update a user's org role or active status (ADMIN only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserAdminInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/organization:
    get:
      tags: [admin]
      summary: Get organization settings (ADMIN only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
    patch:
      tags: [admin]
      summary: Update organization settings (ADMIN only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }

  /admin/feature-flags:
    get:
      tags: [admin]
      summary: List all registered feature flags with their effective state for this org (MANAGE_FEATURE_FLAGS)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags: { type: array, items: { $ref: "#/components/schemas/FeatureFlag" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/feature-flags/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [admin]
      summary: Set or reset a feature-flag override for this org (audited, MANAGE_FEATURE_FLAGS)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetFeatureFlagInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlag" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Unknown flag key (not in the registry) }

  /admin/audit-log:
    get:
      tags: [admin]
      summary: List audit log entries, newest first, filterable (VIEW_AUDIT_LOG)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: action
          in: query
          required: false
          schema: { type: string }
        - name: entityType
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuditLogEntry" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /home:
    get:
      tags: [home]
      summary: Personal Home — My Work, attention inbox, continue working, due soon, projects (ADR-0012)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeResponse" }

  /projects/{projectId}/star:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    post:
      tags: [home]
      summary: Star a project for the Home strip
      responses:
        "200": { description: Starred }
        "404": { description: Project not found / not visible }
    delete:
      tags: [home]
      summary: Unstar a project
      responses:
        "200": { description: Unstarred }

  /projects:
    get:
      tags: [projects]
      summary: List projects visible to the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      tags: [projects]
      summary: Create a project (creator becomes LEAD)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [projects]
      summary: Get a project by id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      summary: Update project settings (LEAD only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [projects]
      summary: Soft-delete a project (LEAD only)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }

  /projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [projects]
      summary: List project members
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectMember" }
    post:
      tags: [projects]
      summary: Add a member to the project (LEAD only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProjectMemberInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMember" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /projects/{projectId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
      - name: memberId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [projects]
      summary: Change a member's project role (LEAD only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMember" }
        "409":
          description: Cannot remove the last LEAD from a project
    delete:
      tags: [projects]
      summary: Remove a member from the project (LEAD only)
      responses:
        "204": { description: Removed }
        "409":
          description: Cannot remove the last LEAD from a project

  /projects/{projectId}/issues:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [issues]
      summary: List issues in a project
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/IssueStatus" }
        - name: sprintId
          in: query
          schema: { type: string }
          description: Pass "null" to filter for backlog (unscheduled) issues
        - name: assigneeId
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/IssueType" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Issue" }
    post:
      tags: [issues]
      summary: Create an issue (server generates the key from Project.issueKeyCounter)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIssueInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }

  /issues/{issueId}:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    get:
      tags: [issues]
      summary: Get an issue by id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [issues]
      summary: Update an issue's fields (title, description, priority, assignee, sprint, labels, etc.)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIssueInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
    delete:
      tags: [issues]
      summary: Soft-delete an issue
      description: >
        Two hierarchy rules, deliberately different (ADR-0045 §9). Deleting an
        EPIC DETACHES its children (`epicId` → null) — they are real work items
        that outlive the grouping. Deleting a parent CASCADES to its subtasks —
        "write the tests", detached from "add login", is noise nobody will
        triage. Both are soft deletes; nothing is hard-deleted.
      responses:
        "204": { description: Deleted }

  # ── Subtasks (ADR-0045, 26_subtasks.md) ────────────────────────────────────
  /issues/{issueId}/subtasks:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    get:
      tags: [issues]
      summary: A parent's subtasks plus the roll-up
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, progress]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Subtask" } }
                  progress: { $ref: "#/components/schemas/SubtaskProgress" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [issues]
      summary: Create a subtask under this parent (BR-12)
      description: >
        A sub-resource rather than a `parentId` on the plain create: a subtask
        cannot exist without a parent, so the parent lives in the path where it
        cannot be omitted, and the create schema keeps refusing `SUBTASK`
        outright. `type`, `epicId` and `storyPoints` are absent from the body —
        the first is always SUBTASK, the second comes from the parent (BR-3),
        the third is refused (BR-6). The new subtask inherits the parent's
        sprint (BR-4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 20000 }
                priority: { $ref: "#/components/schemas/IssuePriority" }
                assigneeId: { type: string, nullable: true }
                dueDate: { type: string, format: date-time, nullable: true }
                estimateMinutes: { type: integer, nullable: true }
                customFields: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "403": { description: Needs project MEMBER or above }
        "409": { description: The parent already has 50 subtasks (BR-9) }
        "422": { description: The parent is an Epic, a subtask, or in another project (BR-2) }

  # ── Timeline (ADR-0047, 28_timeline.md) ────────────────────────────────────
  /projects/{projectId}/timeline:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [projects]
      summary: Bars, tray, sprint bands, dependency arrows and conflicts — one response
      description: >
        Deliberately one call (ADR-0047). Split into pieces, the arrows could
        arrive before the bars they point at and the chart would flicker its way
        to correctness. Takes the SAME query string as every other list route,
        so the timeline narrows with controls people already know. Capped at 200
        bars chosen by soonest due date; `truncated` says when that bit.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timeline" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Calendar (ADR-0048, 29_calendar.md) ────────────────────────────────────
  /projects/{projectId}/calendar:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [projects]
      summary: Events in a date window, plus the unscheduled panel
      description: >
        The Calendar and the Timeline are two pictures of ONE pair of dates, so
        there is no calendar write endpoint: a drag is
        `PATCH /issues/{issueId}/schedule` (ADR-0048 §7), which means version
        checks, RBAC, the archived-project rule and the start-after-due refusal
        are shared rather than re-implemented per view. Takes the SAME query
        string as every other list route. An issue is included when its span
        overlaps the window, where a due date with no start counts as one day on
        the due date. Capped at 500 events; `truncated` says when that bit.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          description: First day drawn, inclusive (`YYYY-MM-DD`).
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          description: >
            Last day drawn, inclusive. Must be on or after `from`, and at most
            62 days after it — a six-week month view plus slack. Wider is a
            report, not a calendar.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Missing, malformed, inverted or too-wide window }

  /issues/{issueId}/schedule:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    patch:
      tags: [issues]
      summary: Set an issue's start and due dates (a drag on the Timeline)
      description: >
        Its own endpoint rather than a corner of the issue PATCH: a drag sends
        two dates and a version and nothing else, so a dragged bar can never
        carry a stale title or assignee from a form left open. Dates are days
        (`YYYY-MM-DD`), not instants — a due date means the same thing in every
        timezone. Absent means "leave it", null means "clear it".
        Moving an issue never moves its dependents (ADR-0047 §7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                startDate: { type: string, nullable: true, example: "2026-08-10" }
                dueDate: { type: string, nullable: true, example: "2026-08-20" }
                expectedVersion: { type: integer }
      responses:
        "200":
          description: The rescheduled row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineRow" }
        "403": { description: Needs project MEMBER or above }
        "409": { description: Stale version (ADR-0011), archived project, or a start after the stored due date }
        "422": { description: A start date after the due date, or a malformed day }

  # ── Dependencies (ADR-0046, 27_dependencies.md) ────────────────────────────
  /issues/{issueId}/links:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    get:
      tags: [issues]
      summary: Every link on this issue, from both ends
      description: >
        One stored row is read from both ends (ADR-0046 §2), so `relation` is
        the sentence the link makes FROM THIS ISSUE — a BLOCKS row where this
        issue is the target comes back as `IS_BLOCKED_BY`. A link into a project
        the caller cannot see returns `{restricted: true}` with no title: the
        link is real and hiding it would make the list silently incomplete, but
        nothing about the issue leaks (BR-6).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [links, openBlockerKeys]
                properties:
                  links: { type: array, items: { $ref: "#/components/schemas/IssueLink" } }
                  openBlockerKeys:
                    type: array
                    items: { type: string }
                    description: Unfinished blockers, by key — what the "mark done anyway?" confirm names.
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [issues]
      summary: Link this issue to another
      description: >
        `direction` decides which end of the stored row this issue occupies, so
        "blocks" and "is blocked by" are one endpoint rather than two that would
        eventually disagree about validation. Symmetric types (RELATES_TO) are
        direction-normalised before the write (BR-3). Links may cross projects
        inside one organisation; the caller needs write access to at least ONE
        of the two projects (BR-11) — requiring both would make a cross-team
        dependency impossible to record by the person being blocked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { $ref: "#/components/schemas/IssueLinkType" }
                direction:
                  type: string
                  enum: [outward, inward]
                  default: outward
                targetId: { type: string, description: The other issue by id. Exactly one of targetId/targetKey. }
                targetKey: { type: string, description: 'The other issue by key ("VWP-42").' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueLink" }
        "403": { description: No write access to either project }
        "409":
          description: >
            Already linked that way, past the 50-link cap (BR-10), or the link
            would close a blocking loop (BR-7) — the message names the ring.
            Jira stores cycles happily; a loop is unschedulable by definition,
            and every consumer of this table would otherwise need its own guard.
        "422": { description: Self-link, or an issue outside the caller's organisation }

  /issue-links/{linkId}:
    delete:
      tags: [issues]
      summary: Remove a link
      description: >
        Addressed by the LINK's id, not a pair of issue ids: one row, one
        identity, and the caller need not know which end it was stored from.
      parameters:
        - { in: path, name: linkId, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "403": { description: No write access to either project }
        "404": { description: Not found, or another tenant's link }

  /issues/{issueId}/transition:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    post:
      tags: [issues]
      summary: Transition an issue's status (validated against the fixed V1 workflow)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/IssueStatus" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "409":
          description: >
            A parent moving into DONE while a subtask is still open
            (26_subtasks BR-7). Jira warns; EAGLES refuses, because cycle time
            and velocity are replayed from status transitions and a story
            marked done over open children records a completion that did not
            happen. The board's drag into the Done column answers to the same
            rule.
        "422":
          description: Invalid transition for the current status

  /issues/{issueId}/rank:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    patch:
      tags: [board, backlog]
      summary: Reorder an issue within its board column or the backlog (string fractional rank, ADR-0009/0013; OCC, ADR-0011)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                scope:
                  type: string
                  enum: [board, backlog]
                  default: board
                  description: Which view's neighbours to validate against (ADR-0013)
                status:
                  type: string
                  description: Board-scope only — a column move; runs the workflow check
                beforeId: { type: string, nullable: true, description: neighbour with the smaller rank (null = list/column start) }
                afterId: { type: string, nullable: true, description: neighbour with the larger rank (null = list/column end) }
                epicId:
                  type: string
                  nullable: true
                  description: Backlog-scope only — reassign the parent epic in the same move (group-by-epic drop, ADR-0026); null clears it
                expectedVersion:
                  type: integer
                  description: Optimistic-concurrency token (ADR-0011)
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }

  /issues/{issueId}/comments:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    get:
      tags: [comments]
      summary: List comments on an issue, oldest-first, keyset-paginated
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: take
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Comment" }
                  nextCursor: { type: string, nullable: true }
                  canComment: { type: boolean }
    post:
      tags: [comments]
      summary: Add a comment (MEMBER/LEAD). parentCommentId reserved for future threading (ADR-0016).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                parentCommentId:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }

  /comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [comments]
      summary: Edit own comment (OCC, ADR-0011)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body, expectedVersion]
              properties:
                body: { type: string }
                expectedVersion: { type: integer, description: OCC token }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
    delete:
      tags: [comments]
      summary: Delete own comment (or any comment, if PROJECT_LEAD/ADMIN)
      responses:
        "204": { description: Deleted }

  /comments/{commentId}/thread:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string }
      - name: cursor
        in: query
        schema: { type: string }
      - name: take
        in: query
        schema: { type: integer, default: 50, maximum: 100 }
    get:
      tags: [comments]
      summary: One thread — a root comment plus a keyset page of its replies (ADR-0038)
      description: >
        404 when the id names a reply rather than a root: threads are one level
        deep, so only a top-level comment has a thread of its own.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [root, replies, nextCursor, canComment, replyCount, issue]
                properties:
                  root: { $ref: "#/components/schemas/Comment" }
                  replies:
                    type: array
                    items: { $ref: "#/components/schemas/Comment" }
                  nextCursor: { type: string, nullable: true }
                  canComment: { type: boolean }
                  replyCount: { type: integer }
                  issue:
                    type: object
                    required: [id, key, title, projectId]
                    properties:
                      id: { type: string }
                      key: { type: string }
                      title: { type: string }
                      projectId: { type: string }
        "404": { description: No such root comment, or not visible to the caller }

  /issues/{issueId}/mentionable:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
      - name: q
        in: query
        description: Name fragment; empty returns the first page of candidates.
        schema: { type: string }
    get:
      tags: [comments]
      summary: Autocomplete candidates for an @mention (ADR-0038)
      description: >
        Ranked issue-participants → project-members → rest of the organisation
        (ADR-0038 amendment). Matches name or email. Scope is the whole
        organisation by design: mentioning someone from another team is normal,
        so they are ranked lower rather than excluded. Not a user directory —
        the caller must already be able to see the issue.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, totalMatches]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, email, avatarUrl, isProjectMember, isParticipant]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        email:
                          type: string
                          description: >
                            Second line in the menu. Display names are not unique —
                            two colleagues can share one — and picking the wrong
                            person notifies them silently.
                        avatarUrl: { type: string, nullable: true }
                        isProjectMember: { type: boolean }
                        isParticipant:
                          type: boolean
                          description: Assignee, reporter or a prior commenter on this issue.
                  totalMatches:
                    type: integer
                    description: >
                      Total people matching the search, not just the page returned —
                      so the menu can say "8 of 34" rather than implying the
                      organisation has eight members.

  /issues/{issueId}/attachments:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    get:
      tags: [attachments]
      summary: List attachments on an issue, oldest-first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, canUpload]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Attachment" }
                  canUpload:
                    type: boolean
                    description: Whether the viewer may upload (MEMBER/LEAD on a non-archived project)
    post:
      tags: [attachments]
      summary: Upload an attachment (multipart; MIME type + size validated server-side, ADR-0017)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "403": { description: Caller is not a project member }
        "422":
          description: File is empty, exceeds the size limit, or its MIME type is not in the allow-list

  /attachments/{attachmentId}:
    parameters:
      - name: attachmentId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [attachments]
      summary: Delete an attachment (uploader, or a project LEAD). Soft-deletes the row; blob removal is best-effort (BR-6).
      responses:
        "200": { description: Deleted }
        "403": { description: Caller is neither the uploader nor a project LEAD }

  /attachments/{attachmentId}/download:
    parameters:
      - name: attachmentId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [attachments]
      summary: >-
        RBAC-gated proxy of the blob bytes (ADR-0017). The bytes are streamed
        through this route after a tenant + role check — never a public URL.
        A signed-URL redirect is a documented future scale seam.
      responses:
        "200":
          description: The file bytes, with Content-Type and Content-Disposition set
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Attachment not found, or its blob is no longer available }

  /labels:
    get:
      tags: [labels]
      summary: All org labels + the viewer's create/manage rights (17_labels.md)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, canCreate, canManage]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Label" }
                  canCreate: { type: boolean }
                  canManage: { type: boolean }
    post:
      tags: [labels]
      summary: Create a label (any org member, BR-1). Case-insensitive unique per org.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: { type: string, maxLength: 50 }
                color: { type: string, description: "#RRGGBB hex" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Label" } } } }
        "409": { description: A label with that name (case-insensitive) already exists }

  /labels/{labelId}:
    parameters:
      - { name: labelId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [labels]
      summary: Rename/recolor a label (org ADMIN or a project LEAD, BR-2)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 50 }
                color: { type: string }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Label" } } } }
        "403": { description: Caller may not manage labels }
    delete:
      tags: [labels]
      summary: Soft-delete a label; detaches it from issues (BR-2/BR-6)
      responses:
        "200": { description: Deleted }
        "403": { description: Caller may not manage labels }

  /issues/{issueId}/labels:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    get:
      tags: [labels]
      summary: The labels on an issue
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Label" } } } } }
    put:
      tags: [labels]
      summary: Replace the issue's label set (MEMBER/LEAD, idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labelIds]
              properties:
                labelIds: { type: array, items: { type: string } }
      responses:
        "200": { description: The issue's labels after the change, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Label" } } } } }
        "403": { description: Caller is not a project member }

  # ── Recurring issues (ADR-0051, 32_recurring.md) ───────────────────────────
  /projects/{projectId}/recurrences:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [projects]
      summary: A project's recurring work, with next run and what each produced
      description: >
        Readable by anyone who can see the project (BR-12) — the person asking
        "where did this ticket come from" is rarely the one who set it up.
        `canManage` gates the controls, not the view.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recurrences" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [projects]
      summary: Create a recurrence
      description: >
        LEAD on the project, or an org ADMIN (BR-12). At most 25 per project.
        The assignee must be a project member; the reporter need only be an
        active user in the organization, matching what `POST /issues` itself
        enforces.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurrenceWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recurrence" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /projects/{projectId}/recurrences/{recurrenceId}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
      - name: recurrenceId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [projects]
      summary: Edit, pause or resume a recurrence
      description: >
        `active: false` pauses it and clears the next run; `true` resumes and
        derives a fresh one. Any edit to the schedule itself re-derives the next
        firing — a stale one would fire once more on the old day and read as the
        edit not having saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurrenceWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recurrence" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [projects]
      summary: Soft-delete a recurrence
      description: Stops immediately. The issues it created are untouched (BR-14).
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /scheduler/tick:
    get:
      tags: [system]
      summary: Same as POST, for schedulers that only issue GET
      description: >
        Vercel Cron issues a `GET` and adds `Authorization: Bearer $CRON_SECRET`
        itself, so a POST-only endpoint would be uncallable on the primary
        deployment target. The operation is idempotent, so it does not need to
        be a POST for safety; POST remains the honest verb for a caller that has
        a choice. `CRON_SECRET` is accepted as an alias for `SCHEDULER_SECRET`.
      security:
        - schedulerSecret: []
      responses:
        "200":
          description: What this tick did
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulerTick" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [system]
      summary: Fire every recurrence that is due
      description: >
        Called by whatever cron the host provides — Vercel Cron, a Kubernetes
        CronJob, a systemd timer, GitHub Actions — so nothing here is a bet on
        the current platform (ADR-0004, ADR-0051 §5). Hourly is the intended
        cadence.


        **No session.** A shared secret as `Authorization: Bearer <secret>`;
        while `SCHEDULER_SECRET` is unset every request is refused, because an
        unauthenticated scheduler endpoint is an unauthenticated issue factory.


        **Idempotent** (BR-5): each due recurrence is claimed with a conditional
        update, so two overlapping ticks create one issue between them and a
        retry after a timeout is safe. At most one issue per recurrence per
        tick, however far behind it is (BR-4).
      security:
        - schedulerSecret: []
      responses:
        "200":
          description: What this tick did
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulerTick" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Automations (ADR-0050, 31_automations.md) ──────────────────────────────
  /projects/{projectId}/automations:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [projects]
      summary: A project's automation rules, with each one's last run
      description: >
        Readable by anyone who can see the project (BR-9) — automated behaviour
        that only admins can explain is worse than no automation, because the
        person asking "why did my ticket move" is rarely the person who wrote
        the rule. `canManage` gates the controls, not the view. A rule whose
        stored document no longer parses comes back with `broken` set rather
        than erroring the whole list (BR-6).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automations" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [projects]
      summary: Create a rule
      description: >
        LEAD on the project, or an org ADMIN (BR-9). One trigger, at most 10
        conditions (ANDed) and 5 actions (in order); at most 20 rules per
        project, and the twenty-first is refused with a reason (AC-11). An
        empty condition list means "every time", but an empty selection INSIDE
        a condition is refused — "type is (nothing)" is a half-configured rule,
        not a filter that matches everything.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationRuleWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRule" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /projects/{projectId}/automations/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
      - name: ruleId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [projects]
      summary: Rename, enable/disable, or replace the rule document
      description: >
        LEAD or org ADMIN. Disabling is the safe alternative to deleting
        (BR-10): a disabled rule is evaluated by nothing and logs nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationRuleWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRule" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [projects]
      summary: Soft-delete a rule
      description: >
        It stops running immediately. Its run log stays — the record of what an
        automation did outlives the rule.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/automations/runs:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [projects]
      summary: The rule audit log, newest first
      description: >
        Every evaluation, including the ones that did nothing (BR-5). Skips are
        the records people assume are noise and are actually the most useful:
        without them "why didn't my rule fire" is unanswerable. Readable by
        anyone who can see the project (BR-9).
      parameters:
        - name: ruleId
          in: query
          schema: { type: string }
          description: Narrow to one rule. Blank reads as absent, never as a rule named "".
        - name: take
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationRun" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/components:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [components]
      summary: The project's components + the viewer's manage right (18_components.md)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, canManage]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Component" } }
                  canManage: { type: boolean }
    post:
      tags: [components]
      summary: Create a component (project LEAD, BR-1). Case-insensitive unique per project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 50 }
                description: { type: string, maxLength: 500, nullable: true }
                ownerId: { type: string, nullable: true, description: default assignee (owner); must be a project member }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Component" } } } }
        "403": { description: Caller is not a project LEAD }
        "409": { description: A component with that name already exists in the project }

  /components/{componentId}:
    parameters:
      - { name: componentId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [components]
      summary: Rename/edit/reassign lead (project LEAD, BR-1)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 50 }
                description: { type: string, maxLength: 500, nullable: true }
                ownerId: { type: string, nullable: true }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Component" } } } }
        "403": { description: Caller is not a project LEAD }
    delete:
      tags: [components]
      summary: Soft-delete a component; detaches it from issues (BR-1/BR-7)
      responses:
        "200": { description: Deleted }
        "403": { description: Caller is not a project LEAD }

  /issues/{issueId}/components:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    get:
      tags: [components]
      summary: The components on an issue
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Component" } } } } }
    put:
      tags: [components]
      summary: >-
        Replace the issue's component set (MEMBER/LEAD). A newly added component
        with a lead auto-assigns the issue if it's unassigned (BR-3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [componentIds]
              properties:
                componentIds: { type: array, items: { type: string } }
      responses:
        "200": { description: The issue's components after the change, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Component" } } } } }
        "403": { description: Caller is not a project member }

  /projects/{projectId}/sprints/order:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    patch:
      tags: [sprints]
      summary: Reorder the planned-sprint queue (FUT-8; LEAD)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sprintIds]
              properties:
                sprintIds:
                  type: array
                  items: { type: string }
                  description: All non-completed sprint ids in the desired order
      responses:
        "200": { description: Reordered }
        "403": { description: Caller is not a project LEAD }
        "422": { description: The sprint list is stale (missing/extra ids) }

  /projects/{projectId}/sprints:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [sprints]
      summary: List sprints for a project, each with derived progress
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SprintWithProgress" }
    post:
      tags: [sprints]
      summary: Create a sprint (PLANNED status; LEAD only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSprintInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sprint" }

  /sprints/{sprintId}:
    parameters:
      - $ref: "#/components/parameters/SprintIdParam"
    patch:
      tags: [sprints]
      summary: Update sprint details (name, goal, dates) — LEAD only
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSprintInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SprintWithProgress" }
    delete:
      tags: [sprints]
      summary: >
        Soft-delete a PLANNED or COMPLETED sprint (LEAD). An ACTIVE sprint must be
        completed first (409). A deleted sprint's issues return to the backlog.
      responses:
        "200": { description: Deleted }
        "403": { description: Caller is not a project LEAD }
        "409": { description: Sprint is ACTIVE }

  /sprints/{sprintId}/start:
    parameters:
      - $ref: "#/components/parameters/SprintIdParam"
    post:
      tags: [sprints]
      summary: Start a sprint (requires name + start/end dates; only one ACTIVE sprint per project)
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sprint" }
        "409":
          description: Another sprint is already ACTIVE for this project

  /sprints/{sprintId}/complete:
    parameters:
      - $ref: "#/components/parameters/SprintIdParam"
    post:
      tags: [sprints]
      summary: >
        Complete a sprint (ACTIVE → COMPLETED); incomplete issues (status != DONE)
        move to the backlog, or to a chosen follow-up PLANNED sprint, keeping their
        ranks (LEAD only).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                moveIncompleteToSprintId:
                  type: string
                  nullable: true
                  description: A PLANNED sprint in the same project; omit/null → backlog
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SprintWithProgress" }
        "409":
          description: Sprint is not ACTIVE

  /issues/{issueId}/sprint:
    parameters:
      - $ref: "#/components/parameters/IssueIdParam"
    patch:
      tags: [sprints, issues]
      summary: >
        Move an issue to a sprint or back to the backlog, positioned between two
        neighbours — one atomic sprintId + rank write, OCC-guarded (ADR-0014).
        MEMBER/LEAD only; target sprint must be same-project and not COMPLETED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveIssueToSprintInput" }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "403": { description: Caller lacks write access (VIEWER/non-member) }
        "409": { description: Stale version, out-of-order neighbours, or a COMPLETED sprint }

  /projects/{projectId}/backlog:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [backlog]
      summary: Get the ordered backlog (issues with sprintId = null), ordered by rank; keyset-paginated
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque keyset cursor (the last item's id from the previous page)
        - name: take
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
          description: Page size (capped at 100)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacklogResponse" }

  /projects/{projectId}/board:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
      - name: sprintId
        in: query
        schema: { type: string }
        description: Defaults to the project's current ACTIVE sprint if omitted
    get:
      tags: [board]
      summary: Get board issues grouped by status column
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardResponse" }

  /notifications:
    get:
      tags: [notifications]
      summary: List the current user's notifications, newest first, keyset-paginated
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: take
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, unreadCount]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  nextCursor: { type: string, nullable: true }
                  unreadCount: { type: integer }

  /notifications/unread-count:
    get:
      tags: [notifications]
      summary: The current user's unread notification count (bell badge poll)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { count: { type: integer } }

  /notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [notifications]
      summary: Mark a single notification as read (own only; idempotent)
      responses:
        "200": { description: Done }

  /notifications/read-all:
    post:
      tags: [notifications]
      summary: Mark all of the current user's notifications as read
      responses:
        "200": { description: Done }

  /projects/{projectId}/epics:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [issues]
      summary: List the project's Epics (for selectors and the board Epic filter, ADR-0026)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  epics:
                    type: array
                    items: { $ref: "#/components/schemas/EpicSummary" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/reports:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [reports]
      summary: List the project's available reports (registry metadata, ADR-0020)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReportMeta" }

  /projects/{projectId}/reports/{reportId}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
      - name: reportId
        in: path
        required: true
        schema: { type: string }
      - name: windowDays
        in: query
        description: Trailing window for cycle-time (default 30).
        schema: { type: integer }
    get:
      tags: [reports]
      summary: Run one report; the registry dispatches by id, result carries its chartType
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportResult" }
        "404": { description: Report or project not found }

  /search:
    get:
      tags: [search]
      summary: Global search across projects and issues the user is authorized to see
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }

  /projects/{projectId}/reports/velocity:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [reports]
      summary: Velocity report (completed story points per closed sprint)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VelocityReport" }

  /projects/{projectId}/reports/status-breakdown:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [reports]
      summary: Current issue count by status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusBreakdownReport" }

  /projects/{projectId}/reports/cycle-time:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      tags: [reports]
      summary: Average time from IN_PROGRESS to DONE over a trailing window
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CycleTimeReport" }

  # ── Saved views + cross-project issues (ADR-0040, 22_saved_views.md) ────────
  /issues:
    get:
      tags: [saved-views]
      summary: Cross-project issue list (22_saved_views.md BR-1)
      description: >
        Project scope is NOT a parameter. It is resolved server-side from the
        caller's project membership (org admins get their whole org);
        `projectIds` can only NARROW that set, never widen it (ADR-0040 §1).
      parameters:
        - { in: query, name: projectIds, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { in: query, name: status, schema: { type: string, enum: [TODO, IN_PROGRESS, IN_REVIEW, DONE] } }
        - { in: query, name: openOnly, schema: { type: boolean }, description: "Everything except DONE. Ignored when `status` is set." }
        - { in: query, name: hasEstimate, schema: { type: boolean }, description: "false = no estimate recorded (the Workload banner's link)." }
        - { in: query, name: assigneeId, schema: { type: string } }
        - { in: query, name: type, schema: { type: string, enum: [EPIC, STORY, TASK, BUG, SUBTASK] } }
        - { in: query, name: blocked, schema: { type: boolean }, description: "Has at least one OPEN blocker (ADR-0046 §7) — the query behind \"what is my team waiting on\". Not \"has any blocker\": an issue blocked by finished work is not blocked." }
        - { in: query, name: subtask, schema: { type: string, enum: [only, exclude] }, description: "Jira's `type != Sub-task`. Absent includes them. Ignored when `type` is set, which already answers the question." }
        - { in: query, name: priority, schema: { type: string, enum: [LOWEST, LOW, MEDIUM, HIGH, HIGHEST] } }
        - { in: query, name: sprintId, schema: { type: string } }
        - { in: query, name: epicId, schema: { type: string } }
        - { in: query, name: labelIds, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { in: query, name: componentIds, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: sort, schema: { type: string, enum: [UPDATED_DESC, UPDATED_ASC, CREATED_DESC, CREATED_ASC, DUE_DATE_ASC, DUE_DATE_DESC, PRIORITY_DESC, PRIORITY_ASC, KEY_ASC] } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: take, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, projectsInScope]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Issue" } }
                  nextCursor: { type: string, nullable: true }
                  projectsInScope:
                    type: integer
                    description: >
                      Projects actually read after the membership intersection.
                      Lets the UI tell "nothing matches" from "you are in none
                      of this view's projects" (BR-3).

  /saved-views:
    get:
      tags: [saved-views]
      summary: The caller's views plus every SHARED view in their org (BR-4)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SavedViewDto" } }
    post:
      tags: [saved-views]
      summary: Create a saved view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, filter]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                filter: { type: object, description: "An IssueFilter; validated with the same schema as the query string (BR-7)." }
                sort: { type: string, default: UPDATED_DESC }
                visibility: { type: string, enum: [PRIVATE, SHARED], default: PRIVATE }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedViewDto" }
        "409": { description: The caller already has a view with that name (BR-10) }

  /saved-views/{viewId}:
    patch:
      tags: [saved-views]
      summary: Rename / re-filter / re-share. Owner or org admin only (BR-5)
      parameters:
        - { in: path, name: viewId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                filter: { type: object }
                sort: { type: string }
                visibility: { type: string, enum: [PRIVATE, SHARED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedViewDto" }
        "403": { description: Shared views are readable by all, writable only by their owner }
        "404": { description: Not found, or someone else's PRIVATE view }
        "409": { description: Duplicate name (BR-10) }
    delete:
      tags: [saved-views]
      summary: Soft delete a saved view (BR-11)
      parameters:
        - { in: path, name: viewId, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "403": { description: Not the owner }
        "404": { description: Not found }

  # ── Bulk edit (ADR-0041, 23_bulk_edit.md) ──────────────────────────────────
  /issues/bulk:
    post:
      tags: [bulk-edit]
      summary: Apply one change set across a selection of issues
      description: >
        Best effort. Each issue is evaluated independently and reported as
        updated / skipped / failed (ADR-0041 §1). A 200 means the REQUEST was
        well-formed — it does not mean every issue changed. Permission, the
        workflow, and project membership are re-checked per issue, server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issueIds, changes]
              properties:
                issueIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
                changes:
                  type: object
                  description: At least one property must be present (BR-2).
                  properties:
                    status: { type: string, enum: [TODO, IN_PROGRESS, IN_REVIEW, DONE] }
                    priority: { type: string, enum: [LOWEST, LOW, MEDIUM, HIGH, HIGHEST] }
                    assigneeId: { type: string, nullable: true, description: "null clears (BR-10)." }
                    sprintId: { type: string, nullable: true, description: "null removes from sprint." }
      responses:
        "200":
          description: Applied. Check the per-issue outcomes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkEditResultDto" }
        "422": { description: No ids, more than 100, or no fields to change }

  # ── Custom fields (ADR-0042, 24_custom_fields.md) ──────────────────────────
  /admin/custom-fields:
    get:
      tags: [custom-fields]
      summary: The organisation's field library (BR-4)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CustomFieldDefinitionDto" } }
        "403": { description: Requires MANAGE_CUSTOM_FIELDS }
    post:
      tags: [custom-fields]
      summary: Create a field definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                type:
                  type: string
                  enum: [TEXT, NUMBER, DATE, CHECKBOX, SELECT, MULTI_SELECT, USER, URL]
                  description: Immutable after creation (BR-2).
                description: { type: string, nullable: true, maxLength: 300 }
                required: { type: boolean, default: false }
                options:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [label]
                    properties:
                      label: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomFieldDefinitionDto" }
        "409": { description: A field with that name already exists (case-insensitive, BR-1) }
        "422": { description: A select with no options, or options on a non-select }

  /admin/custom-fields/{fieldId}:
    patch:
      tags: [custom-fields]
      summary: Rename, describe, toggle required, or edit options
      description: >
        `type` is not accepted — it is immutable (BR-2) and the schema rejects
        it rather than ignoring it. Options carrying an `id` are updated in
        place, which is what makes a rename preserve every value pointing at
        them; options omitted are retired, not erased.
      parameters:
        - { in: path, name: fieldId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                description: { type: string, nullable: true }
                required: { type: boolean }
                options:
                  type: array
                  items:
                    type: object
                    required: [label]
                    properties:
                      id: { type: string }
                      label: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomFieldDefinitionDto" }
        "422": { description: Includes a `type` change, which is refused }
    delete:
      tags: [custom-fields]
      summary: Soft delete. Existing values are retained (BR-12).
      parameters:
        - { in: path, name: fieldId, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /projects/{projectId}/custom-fields:
    get:
      tags: [custom-fields]
      summary: Fields enabled on this project, plus what else is available
      parameters:
        - { in: path, name: projectId, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCustomFieldsDto" }
    put:
      tags: [custom-fields]
      summary: Replace the enabled set and its order (project LEAD only, BR-6)
      description: The array's order IS the display order — there is no separate reorder call.
      parameters:
        - { in: path, name: projectId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fieldIds]
              properties:
                fieldIds: { type: array, maxItems: 30, items: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCustomFieldsDto" }
        "403": { description: Only a project lead may change this }
        "422": { description: Over the 30-field cap, or an unknown field id }

  /issues/{issueId}/custom-fields:
    put:
      tags: [custom-fields]
      summary: Set or clear custom field values on one issue
      description: >
        The whole batch is validated against each field's declared type before
        anything is written — these are fields of one object, and a half-saved
        form is worse than a rejected one. `null` or `""` clears a value, which
        deletes the row (BR-10).
      parameters:
        - { in: path, name: issueId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: true
                  description: fieldId → value. Shape depends on the field's type.
      responses:
        "200":
          description: The re-read field set for this issue
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/IssueCustomFieldDto" } }
        "403": { description: Needs project MEMBER or above }
        "422": { description: A value that does not fit its field's type, or a field not enabled here }

  # ── Dashboards (ADR-0044, 25_dashboards.md) ────────────────────────────────
  /dashboards:
    get:
      tags: [dashboards]
      summary: The caller's dashboards plus every SHARED one in their org (BR-2)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DashboardSummaryDto" } }
    post:
      tags: [dashboards]
      summary: Create a dashboard
      description: >
        No capability gate — dashboards are everyone's (ADR-0044 §1). The
        security boundary is the per-viewer project scope applied to widget
        data, not who may own a dashboard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                visibility: { type: string, enum: [PRIVATE, SHARED], default: PRIVATE }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardDto" }
        "409": { description: The caller already has a dashboard with that name (BR-9) }

  /dashboards/{dashboardId}:
    parameters:
      - { in: path, name: dashboardId, required: true, schema: { type: string } }
    get:
      tags: [dashboards]
      summary: One dashboard with its widget CONFIG (no data — see /data)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardDto" }
        "404": { description: Not found, or someone else's PRIVATE dashboard }
    patch:
      tags: [dashboards]
      summary: Rename / re-share. Owner or org admin only (BR-2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                visibility: { type: string, enum: [PRIVATE, SHARED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardDto" }
        "403": { description: Shared dashboards are readable by all, writable only by their owner }
        "404": { description: Not found, or someone else's PRIVATE dashboard }
        "409": { description: Duplicate name (BR-9) }
    delete:
      tags: [dashboards]
      summary: Soft delete a dashboard (BR-11)
      responses:
        "204": { description: Deleted }
        "403": { description: Not the owner }
        "404": { description: Not found }

  /dashboards/{dashboardId}/widgets:
    put:
      tags: [dashboards]
      summary: Replace the whole widget set, and its order
      description: >
        The array's order IS the display order, so there is no separate reorder
        call that could fall out of step with it. A widget carrying an `id` this
        dashboard owns is updated in place; anything else is created, and
        widgets absent from the payload are deleted.
      parameters:
        - { in: path, name: dashboardId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [widgets]
              properties:
                widgets:
                  type: array
                  maxItems: 12
                  items: { $ref: "#/components/schemas/DashboardWidgetInput" }
      responses:
        "200":
          description: The re-read dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardDto" }
        "403": { description: Not the owner }
        "409": { description: More than 12 widgets (BR-7) }
        "422": { description: A BREAKDOWN with no dimension, or a dimension on a non-BREAKDOWN }

  /dashboards/{dashboardId}/data:
    get:
      tags: [dashboards]
      summary: Every widget's data, in ONE response (ADR-0044 §5)
      description: >
        Batched deliberately. The viewer's project scope is the expensive read
        and is resolved once for the whole dashboard; twelve widgets fetching
        independently would repeat it twelve times. Results are scoped to the
        VIEWER, so two people opening the same shared dashboard can legitimately
        see different numbers (BR-3).
      parameters:
        - { in: path, name: dashboardId, required: true, schema: { type: string } }
      responses:
        "200":
          description: One entry per widget, in the dashboard's order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WidgetDataDto" } }
        "404": { description: Not found, or someone else's PRIVATE dashboard }


components:
  securitySchemes:
    schedulerSecret:
      type: http
      scheme: bearer
      description: >
        The shared secret for `POST /scheduler/tick` (ADR-0051 §5). Not a user
        session — no user is present when a cron fires. Set as
        `SCHEDULER_SECRET`; while it is unset the endpoint refuses everything.
    sessionCookie:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: >
        Auth.js JWT session cookie (HttpOnly, SameSite=Lax). Set on
        successful sign-in via /api/auth/*; every path in this document
        requires it unless the operation is otherwise unauthenticated
        (none currently are).

  parameters:
    ProjectIdParam:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    IssueIdParam:
      name: issueId
      in: path
      required: true
      schema: { type: string }
    SprintIdParam:
      name: sprintId
      in: path
      required: true
      schema: { type: string }
    UserIdParam:
      name: userId
      in: path
      required: true
      schema: { type: string }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Forbidden:
      description: Caller is authenticated but not authorized for this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found (or soft-deleted)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    CustomFieldDefinitionDto:
      type: object
      required: [id, name, type, description, required, options, projectCount]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [TEXT, NUMBER, DATE, CHECKBOX, SELECT, MULTI_SELECT, USER, URL] }
        description: { type: string, nullable: true }
        required: { type: boolean, description: Enforced on issue CREATE only (BR-11). }
        projectCount: { type: integer, description: How many projects have enabled it. }
        options:
          type: array
          items:
            type: object
            required: [id, label, position]
            properties:
              id: { type: string }
              label: { type: string }
              position: { type: integer }
    ProjectCustomFieldsDto:
      type: object
      required: [enabled, available, canManage]
      properties:
        enabled: { type: array, items: { $ref: "#/components/schemas/CustomFieldDefinitionDto" } }
        available: { type: array, items: { $ref: "#/components/schemas/CustomFieldDefinitionDto" } }
        canManage: { type: boolean }
    IssueCustomFieldDto:
      type: object
      required: [fieldId, name, type, description, required, options, value, user]
      properties:
        fieldId: { type: string }
        name: { type: string }
        type: { type: string }
        description: { type: string, nullable: true }
        required: { type: boolean }
        options: { type: array, items: { type: object } }
        value:
          nullable: true
          description: >
            Normalised per type — string (TEXT/URL/SELECT option id/USER id),
            number (NUMBER), ISO string (DATE), boolean (CHECKBOX), or an array
            of option ids (MULTI_SELECT).
        user:
          type: object
          nullable: true
          description: Resolved for USER fields so a row renders without a second lookup.
    BulkEditResultDto:
      type: object
      required: [updated, skipped, failed, results, notificationsSuppressed]
      properties:
        updated: { type: integer }
        skipped: { type: integer, description: Already held every requested value (BR-7). }
        failed: { type: integer }
        notificationsSuppressed:
          type: boolean
          description: Assignment notifications hit the per-operation cap (BR-13).
        results:
          type: array
          items:
            type: object
            required: [issueId, key, outcome]
            properties:
              issueId: { type: string }
              key: { type: string, nullable: true }
              outcome: { type: string, enum: [updated, skipped, failed] }
              reason:
                type: string
                enum: [not_found, forbidden, archived, invalid_transition, invalid_assignee, invalid_sprint, conflict]
              message: { type: string }
    DashboardSummaryDto:
      type: object
      required: [id, name, visibility, owner, canEdit, widgetCount]
      properties:
        id: { type: string }
        name: { type: string }
        visibility: { type: string, enum: [PRIVATE, SHARED] }
        owner:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        canEdit:
          type: boolean
          description: Caller owns it, or is an org admin (BR-2).
        widgetCount: { type: integer }

    DashboardDto:
      type: object
      required: [id, name, visibility, owner, canEdit, widgets]
      properties:
        id: { type: string }
        name: { type: string }
        visibility: { type: string, enum: [PRIVATE, SHARED] }
        owner:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        canEdit: { type: boolean }
        widgets: { type: array, items: { $ref: "#/components/schemas/DashboardWidgetDto" } }

    DashboardWidgetInput:
      type: object
      required: [title, type]
      properties:
        id:
          type: string
          description: >
            Present when editing an existing widget. An id this dashboard does
            not own is treated as a create, never as an update.
        title: { type: string, minLength: 1, maxLength: 60 }
        type: { type: string, enum: [STAT, BREAKDOWN, LIST] }
        width: { type: string, enum: [SMALL, MEDIUM, LARGE], default: SMALL }
        filter:
          type: object
          description: >
            An IssueFilter, same schema as the /issues query string. Ignored —
            and not stored — when `savedViewId` is set (BR-4).
        savedViewId: { type: string, nullable: true }
        breakdownBy:
          type: string
          nullable: true
          enum: [STATUS, PRIORITY, TYPE, ASSIGNEE]
          description: Required for BREAKDOWN, refused otherwise.

    DashboardWidgetDto:
      allOf:
        - $ref: "#/components/schemas/DashboardWidgetInput"
        - type: object
          required: [id, position, filterCorrupt]
          properties:
            position: { type: integer }
            savedViewName:
              type: string
              nullable: true
              description: Resolved for display, so a widget can name its source.
            filterCorrupt:
              type: boolean
              description: >
                The stored filter failed validation and was replaced with an
                empty one; the widget renders with a warning rather than
                breaking the dashboard (BR-12).

    WidgetDataDto:
      type: object
      required: [widgetId, kind]
      description: >
        A discriminated union on `kind`. `unavailable` is what a widget
        referencing a saved view the viewer cannot see returns (BR-5) — never a
        fallback to unfiltered, which would be a WIDER set than intended.
      properties:
        widgetId: { type: string }
        kind: { type: string, enum: [stat, breakdown, list, unavailable] }
        projectsInScope:
          type: integer
          description: Projects actually read after the membership intersection.
        count: { type: integer, description: "kind=stat" }
        slices:
          type: array
          description: "kind=breakdown. At most 12, plus an \"Other\" remainder (BR-10)."
          items:
            type: object
            required: [key, label, count]
            properties:
              key: { type: string }
              label: { type: string }
              count: { type: integer }
        items:
          type: array
          description: "kind=list. At most 10 rows (BR-10)."
          items: { $ref: "#/components/schemas/Issue" }
        total: { type: integer, description: "kind=breakdown|list — everything matching, not just what is shown." }
        reason: { type: string, description: "kind=unavailable — why, in words a reader can act on." }

    SavedViewDto:
      type: object
      required: [id, name, filter, sort, visibility, owner, canEdit, filterCorrupt]
      properties:
        id: { type: string }
        name: { type: string }
        filter: { type: object, description: "IssueFilter, re-validated on read." }
        sort: { type: string }
        visibility: { type: string, enum: [PRIVATE, SHARED] }
        owner:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        canEdit:
          type: boolean
          description: Caller owns it, or is an org admin (BR-5).
        filterCorrupt:
          type: boolean
          description: >
            The stored filter failed validation and was replaced with an empty
            one. The view still opens and says so, rather than 500ing (BR-8).
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    OrgRole:
      type: string
      enum: [ADMIN, MEMBER]
    ProjectRole:
      type: string
      enum: [LEAD, MEMBER, VIEWER]
    IssueType:
      type: string
      # SUBTASK is a real issue type (ADR-0045), always paired with a
      # non-null parentId — a database CHECK constraint keeps the two in step.
      enum: [EPIC, STORY, TASK, BUG, SUBTASK]
    IssueStatus:
      type: string
      enum: [TODO, IN_PROGRESS, IN_REVIEW, DONE]
    IssuePriority:
      type: string
      enum: [LOWEST, LOW, MEDIUM, HIGH, HIGHEST]
    SprintStatus:
      type: string
      enum: [PLANNED, ACTIVE, COMPLETED]
    ProjectStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    NotificationType:
      type: string
      enum: [ASSIGNED, MENTIONED, STATUS_CHANGED, COMMENT_ADDED]

    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        domain: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        orgRole: { $ref: "#/components/schemas/OrgRole" }
        isActive: { type: boolean }
        notificationsEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }

    ProfileDto:
      type: object
      description: The caller's own profile (16_profile.md). Access fields are read-only.
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: string, nullable: true }
        notificationsEnabled: { type: boolean }
        orgRole: { $ref: "#/components/schemas/OrgRole" }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/ProfileMembership" }
      required: [id, name, email, avatarUrl, notificationsEnabled, orgRole, memberships]

    ProfileMembership:
      type: object
      description: A project the user belongs to and their role in it (read-only).
      properties:
        projectId: { type: string }
        projectKey: { type: string }
        projectName: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }
      required: [projectId, projectKey, projectName, role]

    UpdateProfileInput:
      type: object
      minProperties: 1
      additionalProperties: false
      description: >
        Self-service fields only (16_profile.md BR-3). At least one property
        required; no other keys accepted.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        notificationsEnabled: { type: boolean }

    InviteUserInput:
      type: object
      required: [email, name]
      properties:
        email: { type: string }
        name: { type: string }
        orgRole: { $ref: "#/components/schemas/OrgRole" }

    UpdateUserAdminInput:
      type: object
      properties:
        orgRole: { $ref: "#/components/schemas/OrgRole" }
        isActive: { type: boolean }

    UpdateOrganizationInput:
      type: object
      properties:
        name: { type: string }
        domain: { type: string }

    AuditLogEntry:
      type: object
      properties:
        id: { type: string }
        actorId: { type: string, nullable: true }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        beforeData: { type: object, nullable: true }
        afterData: { type: object, nullable: true }
        createdAt: { type: string, format: date-time }

    FeatureFlag:
      type: object
      description: >
        A registered flag (catalog is code, ADR-0023) with its effective state
        for the caller's org. `enabled` is the resolved value; `isOverridden`
        distinguishes an explicit per-org override from the registry default.
      properties:
        key: { type: string }
        description: { type: string }
        owner: { type: string, description: "Owning module/feature" }
        defaultEnabled: { type: boolean }
        enabled: { type: boolean, description: "Effective (override ?? default)" }
        isOverridden: { type: boolean }
        updatedAt: { type: string, format: date-time, nullable: true }

    SetFeatureFlagInput:
      type: object
      description: "Provide `enabled` to set an override, or `reset: true` to remove it."
      properties:
        enabled: { type: boolean }
        reset: { type: boolean }

    Project:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateProjectInput:
      type: object
      required: [key, name]
      properties:
        key: { type: string, description: "Short uppercase code, e.g. ENG" }
        name: { type: string }
        description: { type: string }

    UpdateProjectInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }

    ProjectMember:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        projectId: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }

    AddProjectMemberInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          description: >
            Email of an existing, active org user. Members are added by
            email rather than userId because project LEADs have no
            org-wide user-search endpoint (that's ADMIN-only) — email is
            the natural key a LEAD actually knows. See
            docs/02_Modules/03_projects.md §API.
        role: { $ref: "#/components/schemas/ProjectRole" }

    Sprint:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        goal: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/SprintStatus" }
        startDate: { type: string, format: date-time, nullable: true }
        endDate: { type: string, format: date-time, nullable: true }

    CreateSprintInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        goal: { type: string }

    UpdateSprintInput:
      type: object
      properties:
        name: { type: string }
        goal: { type: string }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }

    SprintProgress:
      type: object
      description: Derived at read time (GROUP BY status); never stored (ADR-0014).
      properties:
        totalIssues: { type: integer }
        doneIssues: { type: integer }
        totalStoryPoints: { type: integer }
        doneStoryPoints: { type: integer }

    SprintWithProgress:
      allOf:
        - $ref: "#/components/schemas/Sprint"
        - type: object
          properties:
            progress: { $ref: "#/components/schemas/SprintProgress" }
            canManage:
              type: boolean
              description: Whether the viewer may create/start/complete/edit (LEAD)

    MoveIssueToSprintInput:
      type: object
      required: [expectedVersion]
      properties:
        sprintId:
          type: string
          nullable: true
          description: Target sprint id, or null to return the issue to the backlog
        beforeId: { type: string, nullable: true }
        afterId: { type: string, nullable: true }
        epicId:
          type: string
          nullable: true
          description: When returning to the backlog, reassign the parent epic in the same move (group-by-epic drop, ADR-0026)
        expectedVersion:
          type: integer
          description: Optimistic-concurrency token (ADR-0011)

    Issue:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        key: { type: string }
        type: { $ref: "#/components/schemas/IssueType" }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/IssueStatus" }
        priority: { $ref: "#/components/schemas/IssuePriority" }
        assigneeId: { type: string, nullable: true }
        reporterId: { type: string }
        sprintId: { type: string, nullable: true }
        epicId: { type: string, nullable: true }
        # Hierarchy (ADR-0026), present on the issue detail: the parent Epic
        # summary (for a child) and the child issues (for an Epic).
        epic: { $ref: "#/components/schemas/EpicSummary", nullable: true }
        children:
          type: array
          items: { $ref: "#/components/schemas/IssueChild" }
        # Subtasks (ADR-0045). `parent` is set only on a SUBTASK; `subtasks`
        # and the roll-up only on a type that may parent one.
        parentId: { type: string, nullable: true }
        parent: { $ref: "#/components/schemas/IssueChild", nullable: true }
        subtasks:
          type: array
          items: { $ref: "#/components/schemas/Subtask" }
        subtaskProgress: { $ref: "#/components/schemas/SubtaskProgress" }
        # Dependencies (ADR-0046), on the detail GET so the panel needs no
        # second round-trip.
        links:
          type: array
          items: { $ref: "#/components/schemas/IssueLink" }
        openBlockerKeys: { type: array, items: { type: string } }
        canHaveSubtasks:
          type: boolean
          description: This type may parent a subtask (STORY, TASK or BUG).
        storyPoints:
          type: integer
          nullable: true
          description: >
            Always null on a SUBTASK, and refused with a 422 if sent — a
            5-point story split into a 3 and a 2 would make velocity read 10
            (ADR-0045 §7). Estimation happens at the level a team commits to.
        rank: { type: string }
        dueDate: { type: string, format: date-time, nullable: true }
        startDate:
          type: string
          format: date-time
          nullable: true
          description: The Timeline bar's left edge (ADR-0047). Set through /issues/{id}/schedule.
        labelIds: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EpicSummary:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        title: { type: string }

    TimelineRow:
      type: object
      required: [id, key, title, type, status, version, rolledUp, blockedBy]
      properties:
        id: { type: string }
        key: { type: string }
        title: { type: string }
        type: { $ref: "#/components/schemas/IssueType" }
        status: { $ref: "#/components/schemas/IssueStatus" }
        priority: { $ref: "#/components/schemas/IssuePriority" }
        startDate: { type: string, nullable: true, description: "YYYY-MM-DD. The bar's left edge." }
        dueDate: { type: string, nullable: true, description: "YYYY-MM-DD. The bar's right edge, INCLUSIVE." }
        version: { type: integer }
        rolledUp:
          type: boolean
          description: >
            An Epic's bar computed from its children rather than stored on it
            (BR-6). Read-only — dragging a number derived from other numbers is
            a control that cannot do what it appears to.
        blockedBy: { type: integer, description: Open blockers (ADR-0046). }

    Recurrences:
      type: object
      required: [items, canManage]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Recurrence" }
        canManage:
          type: boolean
          description: LEAD or org ADMIN (BR-12). A hint for the UI; the service re-checks.

    Recurrence:
      type: object
      required:
        [id, name, active, mode, frequency, interval, startsOn, weekdays, timeOfDay,
         timeZone, skipWeekends, skipIfOpen, title, type, priority, reporter,
         occurrences, summary, recentIssues]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 80 }
        active:
          type: boolean
          description: False when paused by hand, or ended by its own end condition (BR-11).
        mode:
          type: string
          enum: [FIXED_SCHEDULE, AFTER_COMPLETION]
          description: >
            `FIXED_SCHEDULE` fires on the calendar regardless of the last
            instance. `AFTER_COMPLETION` fires `intervalDays` after the previous
            one reaches a DONE category.
        frequency:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]
          description: >
            No YEARLY — monthly with an interval of 12 is yearly and of 3 is
            quarterly, so every real cadence is expressible with one fewer
            frequency to get wrong.
        interval: { type: integer, minimum: 1, maximum: 24 }
        startsOn:
          type: string
          format: date-time
          description: Every interval is counted from here, so "every other Tuesday" stays in phase (BR-15).
        weekdays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: WEEKLY. 0=Sunday. Empty means the weekday `startsOn` falls on.
        dayOfMonth:
          type: integer
          nullable: true
          description: MONTHLY. Clamped to the month's length, so the 31st fires on 28 February.
        timeOfDay: { type: integer, minimum: 0, maximum: 1439, description: Minutes past local midnight. }
        timeZone:
          type: string
          description: IANA zone. Per recurrence, not per org (ADR-0051 §7).
        skipWeekends: { type: boolean, description: DAILY only. }
        skipIfOpen:
          type: boolean
          description: FIXED_SCHEDULE only — skip while the previous instance is open (BR-6).
        intervalDays:
          type: integer
          nullable: true
          description: AFTER_COMPLETION only.
        title: { type: string, maxLength: 200 }
        description: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/IssueType" }
        priority: { $ref: "#/components/schemas/IssuePriority" }
        assignee:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
        reporter:
          type: object
          description: Who the created issues are reported by — a real person (BR-8).
          properties:
            id: { type: string }
            name: { type: string }
        dueInDays: { type: integer, nullable: true }
        nextRunAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Null when paused or ended. The UI leads with this, because a
            scheduler that has stopped produces nothing and says nothing — a
            visibly stale next run is the only symptom.
        lastRunAt: { type: string, format: date-time, nullable: true }
        occurrences: { type: integer }
        endsOn: { type: string, format: date-time, nullable: true }
        maxOccurrences: { type: integer, nullable: true }
        lastError:
          type: string
          nullable: true
          description: >
            Why the last firing failed (BR-13). The occurrence fails, the reason
            is recorded, and the schedule still advances — a stuck recurrence
            silently producing nothing is worse than a gap.
        summary:
          type: string
          description: The schedule as a sentence ("Every Monday at 09:00"), resolved server-side.
        recentIssues:
          type: array
          description: The most recent issues this produced — the record, in place of a run log (§9).
          items:
            type: object
            properties:
              id: { type: string }
              key: { type: string }
              title: { type: string }
              createdAt: { type: string, format: date-time }

    RecurrenceWrite:
      type: object
      description: >
        Create requires `name`, `startsOn` and `title`; PATCH takes any subset
        plus `active`.
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        active: { type: boolean, description: PATCH only — pause or resume. }
        mode: { type: string, enum: [FIXED_SCHEDULE, AFTER_COMPLETION] }
        frequency: { type: string, enum: [DAILY, WEEKLY, MONTHLY] }
        interval: { type: integer, minimum: 1, maximum: 24 }
        startsOn: { type: string, format: date-time }
        weekdays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31, nullable: true }
        timeOfDay: { type: integer, minimum: 0, maximum: 1439 }
        timeZone: { type: string, description: Must be an IANA zone the server recognises. }
        skipWeekends: { type: boolean }
        skipIfOpen: { type: boolean }
        intervalDays:
          type: integer
          minimum: 1
          maximum: 365
          nullable: true
          description: Required when `mode` is AFTER_COMPLETION.
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true }
        type: { type: string, enum: [EPIC, STORY, TASK, BUG] }
        priority: { $ref: "#/components/schemas/IssuePriority" }
        assigneeId: { type: string, nullable: true }
        reporterId: { type: string, description: Defaults to the creator. }
        dueInDays: { type: integer, minimum: 0, maximum: 365, nullable: true }
        endsOn: { type: string, format: date-time, nullable: true }
        maxOccurrences: { type: integer, minimum: 1, maximum: 1000, nullable: true }

    SchedulerTick:
      type: object
      required: [claimed, created, skipped, failed, details]
      description: What one tick did, for the caller's own logs.
      properties:
        claimed:
          type: integer
          description: >
            How many due recurrences this caller won. Under two concurrent ticks
            the two numbers sum to the total due and never overlap (BR-5).
        created: { type: integer }
        skipped: { type: integer, description: e.g. the previous instance is still open. }
        failed: { type: integer }
        details:
          type: array
          items: { type: string }

    Automations:
      type: object
      required: [rules, canManage]
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/AutomationRule" }
        canManage:
          type: boolean
          description: >
            Whether the viewer may create or edit rules — LEAD or org ADMIN
            (BR-9). A hint for the UI only; the service re-checks.

    AutomationRule:
      type: object
      required: [id, name, enabled, trigger, conditions, actions]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 80 }
        enabled: { type: boolean }
        trigger:
          type: string
          enum: [ISSUE_CREATED, STATUS_CHANGED, ASSIGNEE_CHANGED, PRIORITY_CHANGED]
          description: >
            One per rule. Every one is something a person did — scheduled
            triggers need a scheduler and are future scope (AUT-8).
        conditions:
          type: array
          items: { $ref: "#/components/schemas/AutomationCondition" }
          description: ANDed. Empty means the rule runs on every matching trigger.
        actions:
          type: array
          items: { $ref: "#/components/schemas/AutomationAction" }
          description: Run in order. A failure at action two leaves action one applied.
        broken:
          type: string
          description: >
            Present when the stored document no longer parses (BR-6). The rule
            is surfaced and skipped, never executed on a guess about what its
            author meant. `conditions` and `actions` come back empty.
        lastRun:
          allOf: [{ $ref: "#/components/schemas/AutomationRun" }]
          nullable: true

    AutomationRuleWrite:
      type: object
      description: >
        Create requires `name`, `trigger` and at least one action; PATCH takes
        any subset. Discriminated on `kind` throughout, and validated by Zod on
        the way in AND on the way out — the Json columns cannot police their own
        shape (ADR-0050 §7).
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        trigger:
          type: string
          enum: [ISSUE_CREATED, STATUS_CHANGED, ASSIGNEE_CHANGED, PRIORITY_CHANGED]
        enabled: { type: boolean }
        conditions:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/AutomationCondition" }
        actions:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/AutomationAction" }

    AutomationCondition:
      type: object
      required: [kind]
      description: >
        Discriminated on `kind`. Each carries a LIST rather than one value, so
        "type is Bug or Story" is one condition a person can read where two ORed
        conditions would need a grouping concept the builder does not have. A
        list is never empty — that is a half-configured rule, not "match
        everything".
      properties:
        kind:
          type: string
          enum: [TYPE_IS, PRIORITY_IS, STATUS_CATEGORY_IS, STATUS_IS, ASSIGNEE_IS, HAS_LABEL]
        types:
          type: array
          items: { type: string, enum: [EPIC, STORY, TASK, BUG, SUBTASK] }
        priorities:
          type: array
          items: { type: string, enum: [LOWEST, LOW, MEDIUM, HIGH, HIGHEST] }
        categories:
          type: array
          items: { type: string, enum: [TODO, IN_PROGRESS, IN_REVIEW, DONE] }
        statusIds:
          type: array
          items: { type: string }
        userIds:
          type: array
          items: { type: string, nullable: true }
          description: "`null` means unassigned — a real state people build rules around."
        labelIds:
          type: array
          items: { type: string }

    AutomationAction:
      type: object
      required: [kind]
      description: >
        Discriminated on `kind`. Every action goes through the service layer, so
        an automated write obeys every rule a person's write obeys — transition
        restrictions, the subtask-done guard, the status/category invariant
        (BR-7).
      properties:
        kind:
          type: string
          enum: [SET_STATUS, ASSIGN, SET_PRIORITY, ADD_COMMENT, NOTIFY]
        statusId: { type: string }
        userId:
          type: string
          nullable: true
          description: "On `ASSIGN`, `null` unassigns. On `NOTIFY`, required when target is USER."
        priority:
          type: string
          enum: [LOWEST, LOW, MEDIUM, HIGH, HIGHEST]
        body:
          type: string
          maxLength: 2000
          description: >
            Posted as the RULE, never as the person who tripped the trigger
            (ADR-0050 §4). No smart values in V1 (AUT-9).
        target:
          type: string
          enum: [ASSIGNEE, REPORTER, USER]

    AutomationRun:
      type: object
      required: [id, ruleId, ruleName, issueKey, outcome, detail, durationMs, createdAt]
      description: One evaluation. Written for every rule the trigger matched (BR-5).
      properties:
        id: { type: string }
        ruleId: { type: string }
        ruleName: { type: string }
        issueKey:
          type: string
          nullable: true
        outcome:
          type: string
          enum: [SUCCESS, SKIPPED, FAILED]
          description: >
            `SKIPPED` names the condition that stopped it — the most useful of
            the three, because "why didn't my rule fire" is the more common
            question. `FAILED` names the error and leaves earlier actions
            applied.
        detail:
          type: string
          description: One human sentence. The run log is read by people, not by code.
        durationMs: { type: integer }
        createdAt: { type: string, format: date-time }

    Calendar:
      type: object
      required: [from, to, events, unscheduled, truncated, canEdit]
      properties:
        from:
          type: string
          format: date
          description: The window actually queried, echoed back so the client can trust it.
        to: { type: string, format: date }
        events:
          type: array
          items: { $ref: "#/components/schemas/CalendarEvent" }
          description: >
            Everything whose span overlaps the window. Rolled-up Epics are NOT
            included (BR-13) — a derived six-week band across every cell is
            noise in a view about what lands on a day.
        unscheduled:
          type: array
          items: { $ref: "#/components/schemas/CalendarEvent" }
          description: Undated issues, to drag onto a day. Capped at 50.
        truncated:
          type: boolean
          description: More than 500 events fall in the window; the view says so.
        canEdit:
          type: boolean
          description: >
            Whether the viewer may drag anything. A hint for the UI only — the
            boundary is the schedule endpoint, which re-checks server-side.

    CalendarEvent:
      type: object
      required: [id, key, title, type, status, priority, startDate, dueDate, version, blockedBy]
      properties:
        id: { type: string }
        key: { type: string }
        title: { type: string }
        type: { $ref: "#/components/schemas/IssueType" }
        status: { $ref: "#/components/schemas/IssueStatus" }
        priority: { $ref: "#/components/schemas/IssuePriority" }
        assignee:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
            avatarUrl: { type: string, nullable: true }
        startDate:
          type: string
          format: date
          nullable: true
          description: >
            A DAY, never an instant. Null with a due date set means a one-day
            event on the due date.
        dueDate: { type: string, format: date, nullable: true }
        version:
          type: integer
          description: For the optimistic-concurrency check on a drag (ADR-0011).
        blockedBy:
          type: integer
          description: Open blockers — the same count the board badge shows.

    Timeline:
      type: object
      required: [rows, unscheduled, sprints, links, conflictCount, truncated, canEdit]
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/TimelineRow" } }
        unscheduled:
          type: array
          items: { $ref: "#/components/schemas/TimelineRow" }
          description: Undated issues, for the tray. Capped at 50.
        sprints:
          type: array
          description: Bands drawn behind the bars (BR-9).
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              status: { type: string }
              startDate: { type: string }
              endDate: { type: string }
        links:
          type: array
          description: BLOCKS edges where BOTH ends are drawn — an arrow into empty space is worse than no arrow.
          items:
            type: object
            properties:
              id: { type: string }
              blockerId: { type: string }
              dependentId: { type: string }
              conflict:
                type: boolean
                description: >
                  The blocker finishes AFTER the dependent starts, so the plan
                  cannot happen in the order it claims (BR-8). Jira detects this
                  only in the paid Advanced Roadmaps; here it is a comparison of
                  two dates already loaded to draw the bars.
        conflictCount: { type: integer }
        truncated: { type: boolean, description: The 200-bar cap bit; the UI says so and points at the filter. }
        canEdit: { type: boolean }

    IssueLinkType:
      type: string
      enum: [BLOCKS, RELATES_TO, DUPLICATES]

    IssueLink:
      type: object
      required: [id, relation, issue, blocking]
      properties:
        id: { type: string, description: The link row's id — what DELETE takes. }
        relation:
          type: string
          enum: [BLOCKS, IS_BLOCKED_BY, RELATES_TO, DUPLICATES, IS_DUPLICATED_BY]
          description: The sentence this link makes FROM the issue being viewed.
        blocking:
          type: boolean
          description: An unfinished blocker of the issue being viewed. A blocker that is Done is not blocking.
        issue:
          type: object
          description: >
            The far end. `restricted: true` with null id/key when the viewer
            cannot see its project (BR-6) — the link still appears, the issue
            is not described.
          required: [restricted]
          properties:
            restricted: { type: boolean }
            id: { type: string, nullable: true }
            key: { type: string, nullable: true }
            title: { type: string }
            type: { $ref: "#/components/schemas/IssueType" }
            status: { $ref: "#/components/schemas/IssueStatus" }
            priority: { $ref: "#/components/schemas/IssuePriority" }
            projectId: { type: string }
            projectKey: { type: string }

    Subtask:
      type: object
      required: [id, key, title, status, priority, version]
      properties:
        id: { type: string }
        key: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/IssueStatus" }
        priority: { $ref: "#/components/schemas/IssuePriority" }
        assignee: { type: object, nullable: true }
        estimateMinutes: { type: integer, nullable: true }
        version: { type: integer }

    SubtaskProgress:
      type: object
      required: [total, done, estimateMinutes]
      description: >
        Counts and minutes only. Story points never roll up — a subtask cannot
        carry them (ADR-0045 §7).
      properties:
        total: { type: integer }
        done: { type: integer }
        estimateMinutes:
          type: integer
          nullable: true
          description: >
            Parent + subtasks. Null, not 0, when nothing in the tree is
            estimated — "no work left" and "nobody has estimated this" are
            different claims.

    IssueChild:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        title: { type: string }
        type: { $ref: "#/components/schemas/IssueType" }
        status: { $ref: "#/components/schemas/IssueStatus" }

    CreateIssueInput:
      type: object
      required: [type, title]
      properties:
        type: { $ref: "#/components/schemas/IssueType" }
        title: { type: string }
        description: { type: string }
        priority: { $ref: "#/components/schemas/IssuePriority" }
        assigneeId: { type: string, nullable: true }
        sprintId: { type: string, nullable: true }
        epicId: { type: string, nullable: true }
        parentId:
          type: string
          nullable: true
          description: >
            Convert (ADR-0045 §10). A parent id makes this a SUBTASK of it and
            clears the epic and story points it can no longer carry, adopting
            the parent's sprint; `null` promotes a subtask back to a standalone
            TASK. Absent leaves the hierarchy alone. The type is derived from
            this, never taken raw, so the pair can never be written in the
            state the CHECK constraint rejects.
        storyPoints:
          type: integer
          description: 422 on a SUBTASK (ADR-0045 §7).
        dueDate: { type: string, format: date-time }
        labelIds: { type: array, items: { type: string } }

    UpdateIssueInput:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        priority: { $ref: "#/components/schemas/IssuePriority" }
        assigneeId: { type: string, nullable: true }
        sprintId: { type: string, nullable: true }
        epicId: { type: string, nullable: true }
        storyPoints: { type: integer }
        dueDate: { type: string, format: date-time }
        labelIds: { type: array, items: { type: string } }

    Comment:
      type: object
      description: CommentDto (ADR-0016) — designed to grow (reactions/mentions/attachments/replyCount later).
      properties:
        id: { type: string }
        issueId: { type: string }
        parentCommentId: { type: string, nullable: true }
        body: { type: string }
        bodyFormat: { type: string, enum: [PLAIN, MARKDOWN] }
        author:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time, nullable: true }
        version: { type: integer, description: OCC token (ADR-0011) }
        canEdit: { type: boolean }
        canDelete: { type: boolean }

    Attachment:
      type: object
      description: >-
        AttachmentDto (ADR-0017) — designed to grow (scanStatus/previewUrl/hash/version
        are additive later). The blob itself is never exposed as a public URL.
      properties:
        id: { type: string }
        issueId: { type: string }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        uploadedBy:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        downloadUrl:
          type: string
          description: Path to the RBAC-gated download route (never a public URL)
        canDelete:
          type: boolean
          description: Whether the viewer may delete this attachment (uploader or LEAD)

    Label:
      type: object
      description: LabelDto (ADR-0018) — org-scoped tag.
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string, description: "#RRGGBB hex" }

    Component:
      type: object
      description: ComponentDto (ADR-0018) — project-scoped sub-system with an optional default owner.
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        owner:
          type: object
          nullable: true
          description: Default assignee; DB column is `leadId`, exposed as `owner`.
          properties:
            id: { type: string }
            name: { type: string }
            avatarUrl: { type: string, nullable: true }

    Notification:
      type: object
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/NotificationType" }
        entityType: { type: string }
        entityId: { type: string }
        message: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
        link:
          type: string
          nullable: true
          description: Resolved target URL (e.g. the issue detail page); null if unresolvable.

    ReportMeta:
      type: object
      description: Report registry metadata (ADR-0020).
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string, enum: [delivery, flow, workload] }
        chartType: { type: string, enum: [bar, donut, kpi, line] }

    ReportResult:
      type: object
      description: >-
        A computed report. `data` is a per-report shape selected by `chartType`
        (velocity → {sprints[]}, status-breakdown → {total,segments[]},
        cycle-time → {averageDays,sampleSize,windowDays}).
      properties:
        id: { type: string }
        name: { type: string }
        chartType: { type: string, enum: [bar, donut, kpi, line] }
        generatedAt: { type: string, format: date-time }
        data: { type: object }

    BoardResponse:
      type: object
      properties:
        sprintId: { type: string, nullable: true }
        columns:
          type: array
          items:
            type: object
            properties:
              status: { $ref: "#/components/schemas/IssueStatus" }
              issues:
                type: array
                items: { $ref: "#/components/schemas/Issue" }

    BacklogResponse:
      type: object
      description: >
        One keyset-paginated page of the project's unscheduled issues
        (sprintId = null), ordered by the shared rank (ADR-0013).
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        nextCursor:
          type: string
          nullable: true
          description: Cursor for the next page; null on the last page
        canWrite:
          type: boolean
          description: Whether the viewer may drag to reorder (MEMBER/LEAD)

    HomeResponse:
      type: object
      description: >
        The composed Home payload (ADR-0012, docs/02_Modules/02_home.md). A FIXED
        set of sections; future modules feed these (esp. `attention`), never
        adding new ones.
      properties:
        myWork:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        attention:
          type: array
          items: { $ref: "#/components/schemas/AttentionItem" }
        continueWorking:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        dueSoon:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
        starredProjects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        recentProjects:
          type: array
          items: { $ref: "#/components/schemas/Project" }

    AttentionItem:
      type: object
      description: One item in the unified attention inbox, from any AttentionSource.
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [ASSIGNED, UPDATED, MENTION, REVIEW_REQUEST, APPROVAL]
        title: { type: string }
        href: { type: string }
        actorId: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }

    SearchResponse:
      type: object
      description: >
        Lean, palette-oriented results (12_search.md, ADR-0021). Each item
        carries only what the command palette renders — not the full entity.
      properties:
        issues:
          type: array
          items: { $ref: "#/components/schemas/SearchIssueResult" }
        projects:
          type: array
          items: { $ref: "#/components/schemas/SearchProjectResult" }

    SearchIssueResult:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        title: { type: string }
        projectKey: { type: string }
        href: { type: string }

    SearchProjectResult:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        href: { type: string }

    VelocityReport:
      type: object
      properties:
        sprints:
          type: array
          items:
            type: object
            properties:
              sprintId: { type: string }
              sprintName: { type: string }
              committedPoints: { type: integer }
              completedPoints: { type: integer }

    StatusBreakdownReport:
      type: object
      properties:
        counts:
          type: object
          additionalProperties: { type: integer }

    CycleTimeReport:
      type: object
      properties:
        averageDays: { type: number }
        sampleSize: { type: integer }
        windowDays: { type: integer }

security:
  - sessionCookie: []
