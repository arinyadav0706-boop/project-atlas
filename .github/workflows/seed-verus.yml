name: Seed VERUS demo data

# Manual, one-click seed/teardown of the VERUS demo org (ADR-0033) run from
# GitHub's servers — which CAN reach Supabase — so no local setup is needed.
# It only ever creates/deletes the single org id `verus-demo-org`.
#
# Prereq (one time): add a repository secret named DATABASE_URL with your
# Supabase connection string (copy the same value your Vercel project uses).
# Optionally add DIRECT_URL too; if absent, DATABASE_URL is reused.
#
# Run it: Actions tab → "Seed VERUS demo data" → Run workflow →
#   action = seed (or teardown), and type VERUS in the confirm box.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [seed, teardown]
        default: seed
        required: true
      confirm:
        description: 'Type VERUS to confirm you are writing to this database'
        type: string
        required: true

concurrency:
  group: seed-verus
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
    steps:
      - name: Guard — confirmation phrase
        run: |
          if [ "${{ inputs.confirm }}" != "VERUS" ]; then
            echo "::error::Confirmation failed. Type VERUS in the confirm box to proceed."
            exit 1
          fi

      - name: Guard — a database credential is set
        env:
          PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$PW" ]; then
            echo "::error::Set the repository secret SUPABASE_DB_PASSWORD (just the database password) — or DATABASE_URL — in Settings → Secrets and variables → Actions → Secrets tab."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Preferred path: build the connection string from just the DB password,
      # eliminating every URL-format footgun (username, port, encoding). Falls
      # back to the DATABASE_URL secret when the password secret is absent.
      # The password (raw and URL-encoded) is masked before anything is written.
      - name: Resolve database URL
        env:
          PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$PW" ]; then
            echo "::add-mask::$PW"
            node -e "
              const pw = encodeURIComponent(process.env.PW.trim());
              console.log('::add-mask::' + pw);
              const url = 'postgresql://postgres.bhmbgytzvkkcrttuydis:' + pw + '@aws-1-ap-south-1.pooler.supabase.com:5432/postgres';
              const fs = require('fs');
              fs.appendFileSync(process.env.GITHUB_ENV, 'DATABASE_URL=' + url + '\n');
              fs.appendFileSync(process.env.GITHUB_ENV, 'DIRECT_URL=' + url + '\n');
            "
            echo "Using SUPABASE_DB_PASSWORD via the session pooler (postgres.bhmbgytzvkkcrttuydis @ :5432)"
          else
            echo "SUPABASE_DB_PASSWORD not set — using the DATABASE_URL secret as-is"
          fi

      # Cross-region reality check (runner → Supabase). Prints DNS + raw TCP
      # reachability for the DB host so a connection failure in the seed step
      # is diagnosable from the log instead of a guess. Prints host/port only,
      # never credentials.
      - name: Check database connectivity
        run: |
          HOST=$(node -e "console.log(new URL(process.env.DATABASE_URL).hostname)")
          PORT=$(node -e "const u=new URL(process.env.DATABASE_URL); console.log(u.port || 5432)")
          echo "DB host: $HOST:$PORT"
          echo "--- DNS ---"
          nslookup "$HOST" || echo "DNS lookup FAILED"
          echo "--- TCP (15s limit) ---"
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/$HOST/$PORT"; then
            echo "TCP connection OK"
          else
            echo "::error::TCP connection to $HOST:$PORT FAILED — the runner cannot reach Supabase at all."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # GitHub runners sit far from the Mumbai DB; Prisma's default 5s
      # connect_timeout is too tight for the pooler handshake. Extend it
      # (and pool_timeout) on the URL without logging the secret.
      - name: Extend connection timeouts
        run: |
          node -e "
            const u = new URL(process.env.DATABASE_URL);
            u.searchParams.set('connect_timeout', '30');
            u.searchParams.set('pool_timeout', '30');
            require('fs').appendFileSync(process.env.GITHUB_ENV, 'DATABASE_URL=' + u.toString() + '\n');
            const d = new URL(process.env.DIRECT_URL);
            d.searchParams.set('connect_timeout', '30');
            d.searchParams.set('pool_timeout', '30');
            require('fs').appendFileSync(process.env.GITHUB_ENV, 'DIRECT_URL=' + d.toString() + '\n');
          "

      - name: Seed VERUS
        if: ${{ inputs.action == 'seed' }}
        env:
          SEED_VERUS: confirm
        run: npm run seed:verus

      - name: Teardown VERUS
        if: ${{ inputs.action == 'teardown' }}
        run: npm run seed:verus:teardown
