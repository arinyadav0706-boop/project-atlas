# Local development parity with production — the portability contract
# from ADR-0004. Every feature must run correctly here, not only on
# Vercel/Supabase. See docs/06_Infrastructure/01_Infrastructure_Overview.md §2.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eagles
      POSTGRES_PASSWORD: eagles
      POSTGRES_DB: eagles
    ports:
      - "5432:5432"
    volumes:
      - eagles_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eagles"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: "postgresql://eagles:eagles@db:5432/eagles?schema=public"
    ports:
      - "3000:3000"

volumes:
  eagles_postgres_data:
